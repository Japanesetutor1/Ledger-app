<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoloTracker — Calorie &amp; Training Log</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SoloTracker">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101418;
    --surface:#171c21;
    --surface-2:#1f2530;
    --surface-3:#262d39;
    --border:#2a313b;
    --border-soft:#20262e;
    --text:#e8ecef;
    --text-dim:#8891a0;
    --text-faint:#565f6b;
    --credit:#5fb88a;
    --credit-dim:#3a5f4c;
    --debit:#c4634f;
    --debit-dim:#5f3e36;
    --gold:#c9a44c;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:#0a0612;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,255,242,0.045) 0px, rgba(0,255,242,0.045) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(255,43,214,0.035) 0px, rgba(255,43,214,0.035) 1px, transparent 1px, transparent 48px),
      radial-gradient(ellipse 900px 600px at 8% -8%, rgba(255,43,214,0.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 108% 8%, rgba(0,255,242,0.13), transparent 60%),
      radial-gradient(ellipse 900px 800px at 50% 118%, rgba(123,47,247,0.14), transparent 62%);
    background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  .num, .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; }
  #app{ max-width:1040px; margin:0 auto; padding:28px 20px 80px; }
  a, button{ font-family:inherit; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--border);
    padding-bottom:16px; margin-bottom:22px;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;} }
  .wordmark{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px;
    letter-spacing:0.5px; color:var(--text);
  }
  .wordmark span{ color:var(--gold); }
  .tagline{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius); width:32px; height:32px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{ border-color:var(--text-dim); color:var(--text); }

  /* ---------- Date nav ---------- */
  .date-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .date-nav button.nav-arrow{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:30px; height:30px; border-radius:var(--radius); cursor:pointer; font-size:14px;
  }
  .date-nav button.nav-arrow:hover{ border-color:var(--gold); }
  .date-label{
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;
    padding:4px 2px; cursor:pointer; border-bottom:1px dashed var(--text-faint);
  }
  .date-input{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:inherit; border-radius:var(--radius); padding:4px 6px; font-size:13px;
  }
  .today-jump{
    color:var(--gold); font-size:12.5px; cursor:pointer; background:none; border:none;
    padding:0; text-decoration:underline; text-underline-offset:2px;
  }

  /* ---------- Summary ---------- */
  .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; margin-bottom:24px;
  }
  .summary .cell{ background:var(--surface); padding:14px 16px; }
  .summary .cell .label{ color:var(--text-dim); font-size:12px; margin-bottom:6px; }
  .summary .cell .value{ font-size:22px; font-weight:600; }
  .summary .cell .sub{ color:var(--text-faint); font-size:11px; margin-top:4px; }
  .value.credit{ color:var(--credit); }
  .value.debit{ color:var(--debit); }
  @media(max-width:640px){ .summary{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Panels ---------- */
  .panels{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  @media(max-width:760px){ .panels{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{ font-size:13px; margin:0; font-weight:600; }
  .panel-head h2.credit-text{ color:var(--credit); }
  .panel-head h2.debit-text{ color:var(--debit); }
  .panel-head .total{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-dim); }
  .entry-list{ list-style:none; margin:0; padding:0; max-height:260px; overflow-y:auto; }
  .entry-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px;
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-name{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:10px; }
  .entry-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .entry-cals{ font-family:'IBM Plex Mono',monospace; color:var(--text-dim); }
  .del-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px;
    line-height:1; padding:2px 4px;
  }
  .del-btn:hover{ color:var(--debit); }
  .empty-state{ padding:20px 14px; color:var(--text-faint); font-size:13px; }
  .add-row{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); }
  .add-row input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:7px 9px; font-family:inherit; font-size:13px;
  }
  .add-row input.name-input{ flex:1; min-width:0; }
  .add-row input.cal-input{ width:80px; font-family:'IBM Plex Mono',monospace; }
  .add-row button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:0 14px; cursor:pointer; font-size:13px; font-weight:500;
  }
  .add-row button:hover{ border-color:var(--gold); color:var(--gold); }
  .add-row button:disabled{ opacity:.6; cursor:default; }
  .add-row input:disabled{ opacity:.6; }
  .add-row-err{ color:var(--debit); font-size:11.5px; padding:0 14px 10px; margin-top:-4px; }
  .estimated-mark{ color:var(--gold); }

  .favorites-wrap{ border-bottom:1px solid var(--border); }

  .fooddb{ border-bottom:1px solid var(--border); padding:12px 14px; }
  .nutrient-suggest{ padding:12px 14px 0; }
  .nutrient-suggest-btn{
    width:100%; background:var(--surface-2); border:1px dashed var(--credit-dim); color:var(--credit);
    border-radius:var(--radius); padding:9px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .nutrient-suggest-btn:hover{ border-style:solid; border-color:var(--credit); }
  .nutrient-suggest-panel{
    margin-top:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 12px;
  }
  .nutrient-suggest-lead{ color:var(--text-dim); font-size:11.5px; line-height:1.5; margin-bottom:8px; }
  .nutrient-suggest-empty{ color:var(--text-faint); font-size:12px; margin-bottom:8px; }
  .nutrient-suggest-row{
    display:flex; align-items:center; gap:8px; padding:7px 2px; border-bottom:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .nutrient-suggest-row:last-of-type{ border-bottom:none; }
  .nutrient-suggest-info{ flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .nutrient-suggest-name{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nutrient-suggest-tags{ display:flex; gap:4px; flex-wrap:wrap; }
  .nutrient-tag{
    background:var(--credit-dim); color:var(--credit); border-radius:8px; padding:1px 7px;
    font-size:10px; text-transform:uppercase; letter-spacing:0.3px;
  }
  .nutrient-suggest-cals{ color:var(--text-dim); flex-shrink:0; }
  .nutrient-suggest-row button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:3px 9px; font-size:11.5px; cursor:pointer; flex-shrink:0;
  }
  .nutrient-suggest-row button:hover{ border-color:var(--gold); color:var(--gold); }
  .nutrient-suggest-close{
    width:100%; margin-top:6px; background:none; border:none; color:var(--text-faint);
    font-size:11.5px; padding:4px; cursor:pointer;
  }
  .nutrient-suggest-close:hover{ color:var(--text-dim); }
  .fooddb input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:8px 10px; font-family:inherit; font-size:13px; margin-bottom:8px;
  }
  .fooddb-results{ max-height:220px; overflow-y:auto; }
  .fooddb-hint{ color:var(--text-faint); font-size:12px; padding:2px 2px 4px; }
  .fooddb-row{
    display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .fooddb-row:last-child{ border-bottom:none; }
  .fooddb-name{ flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fooddb-unit{ color:var(--text-faint); font-size:11px; }
  .fooddb-cals{ color:var(--text-dim); flex-shrink:0; }
  .fooddb-row button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:3px 9px; font-size:11.5px; cursor:pointer; flex-shrink:0;
  }
  .fooddb-row button:hover{ border-color:var(--gold); color:var(--gold); }
  .fooddb-row button.fooddb-fav{ padding:3px 7px; font-size:13px; }
  .favorites-row{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 4px; }
  .favorites-empty{ padding:12px 14px 4px; color:var(--text-faint); font-size:12px; }
  .favorite-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:5px 8px 5px 12px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:7px;
    max-width:100%;
  }
  .favorite-chip:hover{ border-color:var(--gold); }
  .favorite-chip .fav-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .favorite-chip .fav-cals{ color:var(--text-dim); flex-shrink:0; }
  .favorite-chip .fx-del{ color:var(--text-faint); cursor:pointer; padding:0 2px; flex-shrink:0; }
  .favorite-chip .fx-del:hover{ color:var(--debit); }
  .fav-tools{ display:flex; align-items:center; gap:8px; padding:10px 14px 0; font-size:11px; color:var(--text-faint); }
  .fav-tools button{
    background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:12px;
    padding:2px 9px; font-size:11px; cursor:pointer;
  }
  .fav-tools button:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- Weight strip ---------- */
  .weight-strip{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:24px;
    font-size:13px;
  }
  .weight-strip label{ color:var(--text-dim); }
  .weight-strip input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 8px; width:90px; font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .weight-strip button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 12px; cursor:pointer; font-size:12.5px;
  }
  .weight-strip button:hover{ border-color:var(--gold); color:var(--gold); }
  .weight-strip .logged{ color:var(--text-faint); font-size:12px; }

  /* ---------- Hydration ---------- */
  .hydration{
    display:flex; gap:18px; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:24px;
  }
  .hydration-flask{ flex:0 0 auto; width:64px; height:91px; }
  .hydration-flask svg{ width:100%; height:100%; display:block; }
  .hydration-main{ flex:1; min-width:0; }
  .hydration-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .hydration-head h2{ font-size:13px; margin:0; font-weight:600; color:var(--text); }
  .hydration-pct{ font-size:14px; font-weight:600; }
  .hydration-amounts{ font-size:15px; color:var(--text); margin-bottom:3px; }
  .hydration-sub{ color:var(--text-faint); font-size:11px; margin-bottom:10px; }
  .hydration-buttons{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .hydration-buttons button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 12px; cursor:pointer; font-size:12px;
  }
  .hydration-buttons button:hover{ border-color:#5fa8d3; color:#5fa8d3; }
  .hydration-buttons input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 8px; width:88px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .hydration-buttons .hydration-reset{ color:var(--text-faint); border-color:var(--border); margin-left:auto; }
  .hydration-buttons .hydration-reset:hover{ color:var(--debit); border-color:var(--debit); }
  @media(max-width:520px){ .hydration{ flex-direction:column; align-items:flex-start; } .hydration-flask{ align-self:center; } }

  /* ---------- Trend ---------- */
  .trend{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:24px; }
  .nutrient-coverage{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:24px; }
  .workout-task{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:18px; }
  .workout-task-head{ margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .workout-day-tag{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--gold);
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:2px 9px;
  }
  .fitness-assessment{ background:var(--surface); border:1px solid var(--gold); border-radius:var(--radius); padding:16px; margin-bottom:18px; }
  .fitness-assessment-head{ margin-bottom:4px; }
  .fitness-assessment-head h2{ font-size:13px; margin:0; font-weight:600; }
  .fitness-assessment-sub{ color:var(--text-dim); font-size:12px; line-height:1.5; margin:4px 0 14px; }
  .fitness-q{ margin-bottom:14px; }
  .fitness-q-label{ font-size:12.5px; color:var(--text); margin-bottom:7px; }
  .fitness-opts{ display:flex; flex-wrap:wrap; gap:6px; }
  .fitness-opt{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:14px; padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .fitness-opt:hover{ border-color:var(--gold); }
  .fitness-opt.active{ border-color:var(--gold); color:var(--gold); background:var(--surface-3); }
  .fitness-assessment-actions{ display:flex; align-items:center; gap:12px; margin-top:4px; }
  .fitness-submit-btn{
    background:var(--gold); color:#1a1508; border:none; border-radius:var(--radius); font-weight:700;
    padding:9px 16px; font-size:13px; cursor:pointer;
  }
  .fitness-submit-btn[disabled]{ opacity:0.4; cursor:not-allowed; }
  .fitness-skip-btn{ background:none; border:none; color:var(--text-faint); font-size:12px; cursor:pointer; }
  .fitness-skip-btn:hover{ color:var(--text-dim); }
  .workout-task-head h2{ font-size:13px; margin:0; font-weight:600; }
  .workout-task-target{ font-size:15px; font-weight:600; color:var(--text); margin-bottom:10px; }
  .workout-task-target-done{ color:var(--text-dim); font-weight:500; }
  .workout-task-feedback-tag{ color:var(--credit); font-size:12px; }
  .workout-task-btn{
    width:100%; background:var(--gold); color:#1a1508; border:none; border-radius:var(--radius);
    padding:10px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .workout-feedback-prompt{ font-size:12.5px; color:var(--text-dim); margin-bottom:8px; }
  .workout-feedback-actions{ display:flex; gap:8px; }
  .workout-feedback-btn{
    flex:1; border-radius:var(--radius); padding:10px 8px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border);
  }
  .workout-feedback-btn.easy{ background:var(--credit-dim); color:var(--credit); border-color:var(--credit-dim); }
  .workout-feedback-btn.hard{ background:var(--debit-dim); color:var(--debit); border-color:var(--debit-dim); }
  .workout-feedback-btn:hover{ filter:brightness(1.15); }
  .workout-task-cancel{
    display:block; width:100%; margin-top:8px; background:none; border:none; color:var(--text-faint);
    font-size:11.5px; padding:4px; cursor:pointer;
  }
  .nutrient-coverage-head{ margin-bottom:12px; }
  .nutrient-coverage-head h2{ font-size:13px; margin:0; font-weight:600; }
  .nutrient-cov-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
  .nutrient-cov-label{ width:70px; flex-shrink:0; font-size:12.5px; color:var(--text-dim); text-transform:capitalize; }
  .nutrient-cov-bar-outer{ flex:1; height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden; }
  .nutrient-cov-bar-inner{ height:100%; border-radius:4px; transition:width .3s ease; }
  .nutrient-cov-count{ width:36px; text-align:right; flex-shrink:0; font-size:12px; color:var(--text-dim); }
  .nutrient-cov-note{ color:var(--text-faint); font-size:11px; line-height:1.5; margin-top:10px; }
  .nutrient-cov-suggest-btn{
    width:100%; margin-top:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--gold);
    border-radius:var(--radius); padding:8px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .nutrient-cov-suggest-btn:hover{ border-color:var(--gold); }
  .trend-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .trend-head h2{ font-size:13px; margin:0; font-weight:600; }
  .trend-head .window-toggle{ display:flex; gap:6px; }
  .window-toggle button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius); padding:3px 9px; font-size:11.5px; cursor:pointer;
  }
  .window-toggle button.active{ border-color:var(--gold); color:var(--gold); }
  .chart-wrap{ margin:10px 0 16px; }
  .trend-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  @media(max-width:640px){ .trend-stats{ grid-template-columns:1fr; } }
  .trend-stats .cell{ background:var(--surface-2); padding:12px 14px; }
  .trend-stats .label{ color:var(--text-dim); font-size:11.5px; margin-bottom:5px; }
  .trend-stats .value{ font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; }
  .trend-stats .sub{ color:var(--text-faint); font-size:11px; margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .trend-balance-cell, .trend-eta-cell{
    background:var(--surface-2); padding:12px 14px; border-radius:var(--radius);
    border:1px solid var(--border); margin-top:12px;
  }
  .trend-projection{ margin-top:14px; }
  .trend-projection-label{ color:var(--text-dim); font-size:12px; margin-bottom:8px; }
  .trend-projection-note{ color:var(--text-faint); font-size:11px; line-height:1.55; margin-top:10px; }
  .trend-empty{ color:var(--text-faint); font-size:13px; padding:6px 2px; }

  /* ---------- Settings ---------- */
  .settings-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:24px; display:none;
  }
  .settings-panel.open{ display:block; }
  .settings-panel h2{ font-size:13px; margin:0 0 14px; font-weight:600; color:var(--gold); }
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }

  .field label{ display:block; color:var(--text-dim); font-size:11.5px; margin-bottom:5px; }

  .backup-buttons{ display:flex; gap:10px; margin-top:10px; }

  .reset-link:hover{ color:var(--debit); }
  .baseline-note{ color:var(--text-faint); font-size:11.5px; margin-top:10px; line-height:1.5; }

  .setup-banner{
    background:var(--surface); border:1px solid var(--gold); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:20px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .setup-banner button{ background:var(--gold); border:none; color:#191410; font-weight:600; border-radius:var(--radius); padding:7px 14px; cursor:pointer; font-size:12.5px; }
  .backup-reminder{ border-color:#5fa8d3; }
  .backup-reminder-actions{ display:flex; gap:8px; flex-shrink:0; }
  .backup-reminder-actions button:first-child{ background:#5fa8d3; color:#0d1720; }
  .backup-reminder-actions .reminder-dismiss{ background:none; border:1px solid var(--border); color:var(--text-dim); }
  .backup-reminder-actions .reminder-dismiss:hover{ color:var(--text); border-color:var(--text-dim); }

  .loading{ color:var(--text-dim); padding:40px 0; text-align:center; font-family:'IBM Plex Mono',monospace; }

  /* ---------- Status panel (mascot / level / quests) ---------- */
  .status-panel{
    background:linear-gradient(160deg,#12161c,#0d1014);
    border:1px solid var(--status-color,var(--gold));
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px -6px var(--status-color,var(--gold));
    border-radius:var(--radius); padding:18px 18px 6px; margin-bottom:22px;
    transition:box-shadow .4s ease, border-color .4s ease;
  }
  .status-top{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .status-mascot-wrap{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .status-mascot{
    width:130px; height:143px; padding:0; margin:0; border:none; background:none;
    cursor:pointer; border-radius:var(--radius); transition:transform .15s ease;
  }
  .status-mascot:hover{ transform:scale(1.04); }
  .status-mascot:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .status-mascot svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .status-mascot-hint{ font-size:10px; color:var(--text-faint); }
  .workout-quote-bubble{
    position:relative; background:var(--surface-2); border:1px solid var(--gold); border-radius:var(--radius);
    padding:12px 14px 10px; max-width:280px; flex:1 1 200px; margin-top:6px;
  }
  .workout-quote-bubble::before{
    content:''; position:absolute; left:20px; top:-7px; width:12px; height:12px;
    background:var(--surface-2); border-left:1px solid var(--gold); border-top:1px solid var(--gold);
    transform:rotate(45deg);
  }
  .workout-quote-text{ font-size:12.5px; font-style:italic; color:var(--text); line-height:1.5; }
  .mascot-portrait{
    position:relative; width:100%; height:100%; border-radius:var(--radius);
    overflow:hidden; box-shadow:0 0 0 2px var(--mascot-glow, transparent), 0 0 18px -2px var(--mascot-glow, transparent);
    transition:box-shadow .5s ease; background:none;
  }
  .mascot-portrait-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center center;
    display:block; pointer-events:none; user-select:none;
  }
  .mascot-portrait-blink{ opacity:0; animation:portraitBlink 5.4s ease-in-out infinite; }
  .avatar-class-thumb .mascot-portrait{ box-shadow:none; }
  @media (prefers-reduced-motion: reduce){
    .mascot-portrait-blink{ animation:none; opacity:0; }
  }
  @keyframes portraitBlink{
    0%, 90%, 96%, 100% { opacity:0; }
    92%, 94% { opacity:1; }
  }
  .mascot-figure{ transform-box:view-box; transform-origin:center; animation:mascotBob 3.6s ease-in-out infinite; }
  .mascot-eye{ transform-box:fill-box; transform-origin:center; animation:mascotBlink 5.2s ease-in-out infinite; }
  .mascot-sparkle{ transform-box:fill-box; transform-origin:center; animation:mascotTwinkle 1.8s ease-in-out infinite; }
  .mascot-orb{ transform-box:fill-box; transform-origin:center; animation:mascotOrbPulse 2.2s ease-in-out infinite; }
  .mage-ice, .mage-fire, .mage-earth, .mage-tea{ transform-box:fill-box; transform-origin:center; opacity:0; animation-duration:12s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  .mage-ice{ animation-name:mageIcePhase; }
  .mage-fire{ animation-name:mageFirePhase; }
  .mage-earth{ animation-name:mageEarthPhase; }
  .mage-tea{ animation-name:mageTeaPhase; }
  @keyframes mascotBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes mascotBlink{ 0%,90%,100%{ transform:scaleY(1); } 93%{ transform:scaleY(0.1); } 96%{ transform:scaleY(1); } }
  @keyframes mascotTwinkle{ 0%,100%{ opacity:0.35; transform:scale(0.75); } 50%{ opacity:1; transform:scale(1.15); } }
  @keyframes mascotOrbPulse{ 0%,100%{ opacity:0.85; transform:scale(1); } 50%{ opacity:1; transform:scale(1.2); } }
  @keyframes mageIcePhase{
    0%,2%,24%,100%{ opacity:0; transform:translateY(4px) scale(0.7); }
    6%,18%{ opacity:1; transform:translateY(0) scale(1); }
    22%{ opacity:0; transform:translateY(-4px) scale(0.85); }
  }
  @keyframes mageFirePhase{
    0%,25%,49%,100%{ opacity:0; transform:translateY(4px) scale(0.7); }
    29%,45%{ opacity:1; transform:translateY(0) scale(1); }
    47%{ opacity:0; transform:translateY(-3px) scale(0.9); }
  }
  @keyframes mageEarthPhase{
    0%,50%,74%,100%{ opacity:0; transform:translateY(6px) scale(0.7); }
    54%,70%{ opacity:1; transform:translateY(0) scale(1); }
    72%{ opacity:0; transform:translateY(-2px) scale(0.95); }
  }
  @keyframes mageTeaPhase{
    0%,75%,99%,100%{ opacity:0; transform:translateY(3px) scale(0.85); }
    79%,95%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .mascot-figure, .mascot-eye, .mascot-sparkle, .mascot-orb, .mage-ice, .mage-fire, .mage-earth, .mage-tea,
    .ranger-arrow, .ranger-explosive, .ranger-fire, .ranger-magic1, .ranger-magic2, .ranger-magic3, .ranger-boom-burst{ animation:none; }
  }
  /* Ranger: four arrow types on one shared 16s clock, non-overlapping
     windows, matching the mage's cycle pattern. Each shoots (translateX)
     and fades rather than just appearing in place. */
  .ranger-arrow, .ranger-explosive, .ranger-fire, .ranger-magic1, .ranger-magic2, .ranger-magic3{
    transform-box:fill-box; transform-origin:left center; opacity:0;
    animation-duration:16s; animation-iteration-count:infinite; animation-timing-function:ease-in;
  }
  .ranger-arrow{ animation-name:rangerArrowPhase; }
  .ranger-explosive{ animation-name:rangerExplosivePhase; }
  .ranger-fire{ animation-name:rangerFirePhase; }
  .ranger-magic1{ animation-name:rangerMagic1Phase; }
  .ranger-magic2{ animation-name:rangerMagic2Phase; }
  .ranger-magic3{ animation-name:rangerMagic3Phase; }
  @keyframes rangerArrowPhase{
    0%,2%,17%,100%{ opacity:0; transform:translateX(0); }
    4%,9%{ opacity:1; transform:translateX(-3px); }
    14%{ opacity:1; transform:translateX(6px); }
    16%{ opacity:0; transform:translateX(9px); }
  }
  @keyframes rangerExplosivePhase{
    0%,25%,42%,100%{ opacity:0; transform:translateX(0); }
    27%,32%{ opacity:1; transform:translateX(-3px); }
    38%,40%{ opacity:1; transform:translateX(5px); }
    41.5%{ opacity:0; transform:translateX(6px); }
  }
  @keyframes rangerFirePhase{
    0%,50%,67%,100%{ opacity:0; transform:translateX(0); }
    52%,57%{ opacity:1; transform:translateX(-3px); }
    62%{ opacity:1; transform:translateX(6px); }
    64%{ opacity:0; transform:translateX(9px); }
  }
  @keyframes rangerMagic1Phase{
    0%,75%,78%,92%,100%{ opacity:0; transform:translateX(0) scale(0.8); }
    76%,77%{ opacity:1; transform:translateX(5px) scale(1); }
  }
  @keyframes rangerMagic2Phase{
    0%,76.5%,79.5%,93.5%,100%{ opacity:0; transform:translateX(0) scale(0.8); }
    77.5%,78.5%{ opacity:1; transform:translateX(6px) scale(1); }
  }
  @keyframes rangerMagic3Phase{
    0%,78%,81%,95%,100%{ opacity:0; transform:translateX(0) scale(0.8); }
    79%,80%{ opacity:1; transform:translateX(5px) scale(1); }
  }
  .ranger-boom-burst{ transform-box:fill-box; transform-origin:center; opacity:0; animation:rangerBoomBurst 16s ease-in-out infinite; }
  @keyframes rangerBoomBurst{
    0%,38%,41.5%,100%{ opacity:0; }
    39.5%,40.5%{ opacity:1; }
  }

  /* ---------- Avatar picker (class + color scheme) ---------- */
  .avatar-picker-backdrop{
    position:fixed; inset:0; background:rgba(6,8,10,.72); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .avatar-picker{
    background:linear-gradient(160deg,#12161c,#0d1014); border:1px solid var(--gold);
    border-radius:var(--radius); padding:20px; max-width:460px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px -8px rgba(0,0,0,.6);
  }
  .avatar-picker-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .avatar-picker-head h2{ font-size:14px; margin:0; color:var(--gold); }
  .avatar-picker-close{ background:none; border:none; color:var(--text-dim); font-size:20px; line-height:1; cursor:pointer; padding:2px 6px; }
  .avatar-picker-close:hover{ color:var(--gold); }
  .avatar-picker-preview{ width:140px; height:154px; margin:0 auto 14px; }
  .avatar-picker-preview svg{ width:100%; height:100%; display:block; }
  .avatar-class-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  @media(max-width:420px){ .avatar-class-grid{ grid-template-columns:repeat(2,1fr); } }
  .avatar-class-tile{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 6px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color:var(--text-dim); font-size:11px;
  }
  .avatar-class-tile.active{ border-color:var(--gold); color:var(--gold); background:var(--surface-3); }
  .avatar-class-thumb{ width:52px; height:57px; display:block; }
  .avatar-class-thumb svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .avatar-class-name{ font-weight:600; }
  .avatar-scheme-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .avatar-scheme-label{ font-size:11.5px; color:var(--text-dim); }
  .avatar-scheme-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .avatar-scheme-swatch{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0;
  }
  .avatar-scheme-swatch.active{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,164,76,.35); }

  .status-main{ flex:1; min-width:220px; }
  .status-row1{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .status-titles{ display:flex; align-items:baseline; gap:10px; }
  .status-level{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:var(--status-color,var(--gold)); }
  .status-title-word{ font-size:12.5px; color:var(--text-dim); }
  .status-state{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--status-color,var(--gold)); }
  .xp-bar-outer{ height:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .xp-bar-inner{ height:100%; background:var(--status-color,var(--gold)); transition:width .5s ease; }
  .xp-caption{ color:var(--text-faint); font-size:11px; display:flex; justify-content:space-between; margin-bottom:10px; }
  .status-flavor{ color:var(--text-dim); font-size:12.5px; margin-bottom:12px; font-style:italic; }
  .stat-bars{ display:grid; grid-template-columns:1fr; gap:7px; margin-bottom:14px; }
  .stat-bar-row{ display:grid; grid-template-columns:78px 1fr 30px; align-items:center; gap:8px; }
  .stat-bar-label{ font-size:11px; color:var(--text-dim); }
  .stat-bar-outer{ height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .stat-bar-inner{ height:100%; border-radius:3px; }
  .stat-bar-val{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); text-align:right; }
  .quests{ border-top:1px solid var(--border); padding:12px 0 12px; }
  .quests-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .quests-head h2{ font-size:12px; margin:0; font-weight:600; color:var(--text-dim); }
  .quests-head .streak{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
  .quest-list{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; }
  @media(max-width:560px){ .quest-list{ grid-template-columns:1fr; } .status-top{ flex-direction:column; align-items:flex-start; } }
  .quest-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .quest-check{
    width:15px; height:15px; border-radius:3px; border:1px solid var(--text-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:10px;
  }
  .quest-row.done .quest-check{ background:var(--credit); border-color:var(--credit); color:#0d1512; }
  .quest-row.done .quest-name{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint); }
  .quest-name{ flex:1; color:var(--text); }
  .quest-xp{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); }

  /* ---------------- profile / PIN gate ---------------- */
  .auth-gate{
    min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px 16px; max-width:380px; margin:0 auto; gap:4px;
    animation:authGateFade .22s ease;
  }
  @keyframes authGateFade{
    from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); }
  }
  .auth-brand{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:24px; letter-spacing:0.5px;
    color:var(--text); margin-bottom:18px;
  }
  .auth-brand span{ color:var(--gold); }
  .auth-title{ font-size:17px; font-weight:600; margin:0 0 4px; color:var(--text); }
  .auth-sub{ font-size:13px; color:var(--text-dim); margin:0 0 18px; line-height:1.5; }
  .auth-error{ color:var(--debit); font-size:12.5px; margin:8px 0 0; }
  .auth-error-slot{ min-height:20px; color:var(--debit); font-size:12.5px; margin:10px 0 0; }

  .auth-profile-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; margin-top:6px;
  }
  .auth-quickswitch-label{
    font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;
    margin-top:22px; margin-bottom:10px;
  }
  .auth-profile-tile{ position:relative; }
  .auth-profile-btn{
    width:100%; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:linear-gradient(160deg,#12161c,#0d1014); border:1px solid #262b34; border-radius:var(--radius);
    padding:16px 6px 10px; cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .auth-profile-btn:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .auth-avatar-initial{
    width:44px; height:44px; border-radius:50%; background:var(--gold); color:#1a1508;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .auth-profile-name{ font-size:12px; color:var(--text); word-break:break-word; }
  .auth-profile-delete{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:#2a1518; border:1px solid var(--debit); color:var(--debit); font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .auth-add-tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:none; border:1px dashed #363c47; border-radius:var(--radius); padding:16px 6px; cursor:pointer;
    color:var(--text-dim); width:100%;
  }
  .auth-add-tile:hover{ border-color:var(--gold); color:var(--gold); }
  .auth-add-plus{ font-size:20px; line-height:1; }

  .auth-username-input{
    width:100%; box-sizing:border-box; background:#0d1014; border:1px solid #262b34; border-radius:var(--radius);
    color:var(--text); padding:11px 12px; font-size:15px; text-align:center; margin-top:4px;
  }
  .auth-username-input:focus{ outline:none; border-color:var(--gold); }

  .auth-actions{ display:flex; gap:10px; margin-top:16px; width:100%; justify-content:center; }
  .auth-actions-links{ margin-top:14px; }
  .auth-primary{
    background:var(--gold); color:#1a1508; border:none; border-radius:var(--radius); font-weight:700;
    padding:10px 22px; font-size:14px; cursor:pointer; flex:1; max-width:200px;
  }
  .auth-cancel, .auth-link{
    background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; padding:8px 10px;
  }
  .auth-cancel:hover, .auth-link:hover{ color:var(--text); }

  .auth-pin-dots{ display:flex; gap:16px; justify-content:center; margin:10px 0 0; }
  .auth-pin-dot{
    width:16px; height:16px; border-radius:50%; border:1.5px solid #363c47; background:none;
    transition:background .12s ease, border-color .12s ease, transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  .auth-pin-dot.filled{
    background:var(--gold); border-color:var(--gold); transform:scale(1.22);
    box-shadow:0 0 9px -1px var(--gold);
  }
  .auth-pin-dots.shake{ animation:authShake .35s ease; }
  @keyframes authShake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); }
  }

  .auth-keypad{
    display:grid; grid-template-columns:repeat(3,64px); gap:12px; justify-content:center; margin-top:6px;
  }
  .auth-key{
    width:64px; height:64px; border-radius:50%; background:#12161c; border:1px solid #262b34; color:var(--text);
    font-family:'IBM Plex Mono',monospace; font-size:20px; cursor:pointer;
    transition:background .12s ease, transform .08s ease; -webkit-tap-highlight-color:transparent;
  }
  .auth-key:hover{ background:#1a1f28; border-color:var(--gold); }
  .auth-key:active{ background:#232a35; transform:scale(0.9); }
  .auth-key-blank{ background:none; border:none; cursor:default; }
  .auth-key-back{ font-size:18px; color:var(--text-dim); }
</style>

<div id="app"><div class="loading">Opening SoloTracker…</div></div>

<script>
(function(){
  // Outside the Claude artifact environment window.storage doesn't exist —
  // fall back to localStorage so the app works standalone on a phone.
  var usingLocalFallback = !window.storage;
  if(usingLocalFallback){
    window.storage = {
      get: async function(key){
        try{
          var v = localStorage.getItem(key);
          if(v === null) return null;
          return { key: key, value: v, shared: false };
        }catch(e){ return null; }
      },
      set: async function(key, value){
        try{
          localStorage.setItem(key, value);
          return { key: key, value: value, shared: false };
        }catch(e){ return null; }
      },
      delete: async function(key){
        try{
          localStorage.removeItem(key);
          return { key: key, deleted: true, shared: false };
        }catch(e){ return null; }
      },
      list: async function(prefix){
        try{
          var keys = [];
          for(var i=0;i<localStorage.length;i++){
            var k = localStorage.key(i);
            if(!prefix || k.indexOf(prefix) === 0) keys.push(k);
          }
          return { keys: keys, prefix: prefix, shared: false };
        }catch(e){ return null; }
      }
    };

    // Real mitigation for iOS Safari's well-documented localStorage-eviction
    // issue on installed home-screen apps — not a full guarantee, but a
    // legitimate, harmless request supported by most browsers.
    if(navigator.storage && navigator.storage.persist){

  // Second, independent storage backend (IndexedDB) mirrored alongside
  // localStorage whenever running standalone. Two unrelated storage systems
  // are very unlikely to both get evicted at once, and this needs zero
  // action from the user — it's the "auto backup" safety belt. Every write
  // goes to both; on load, whichever side actually has data wins, and the
  // other side gets silently repaired from it.
  function idbOpen(){
    return new Promise(function(resolve, reject){
      if(!('indexedDB' in window)) return reject(new Error('no indexedDB'));
      var req = indexedDB.open('ledger-backup', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbSet(key, value){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        try{
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(value, key);
          tx.oncomplete = function(){ resolve(true); };
          tx.onerror = function(){ resolve(false); };
        }catch(e){ resolve(false); }
      });
    }).catch(function(){ return false; });
  }
  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        try{
          var tx = db.transaction('kv', 'readonly');
          var req = tx.objectStore('kv').get(key);
          req.onsuccess = function(){ resolve(req.result != null ? req.result : null); };
          req.onerror = function(){ resolve(null); };
        }catch(e){ resolve(null); }
      });
    }).catch(function(){ return null; });
  }
  function idbDelete(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        try{
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').delete(key);
          tx.oncomplete = function(){ resolve(true); };
          tx.onerror = function(){ resolve(false); };
        }catch(e){ resolve(false); }
      });
    }).catch(function(){ return false; });
  }

  async function sha256Hex(str){
    if(window.crypto && window.crypto.subtle){
      try{
        var enc = new TextEncoder().encode(str);
        var buf = await window.crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      }catch(e){ /* fall through to weak fallback below */ }
    }
    // Non-secure-context fallback (e.g. plain http). Weak, but this isn't
    // real security to begin with — see the note above.
    var hash = 0;
    for(var i=0;i<str.length;i++){ hash = ((hash<<5)-hash+str.charCodeAt(i))|0; }
    return 'w' + (hash>>>0).toString(16);
  }
  function randomSalt(){
    if(window.crypto && window.crypto.getRandomValues){
      var arr = new Uint8Array(8);
      window.crypto.getRandomValues(arr);
      return Array.from(arr).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }
  function hashPin(pin, salt){ return sha256Hex(salt + ':' + pin); }

    if(usingLocalFallback && raw) idbSet('profiles', JSON.stringify(profiles));

  // One-time check for data saved before profiles existed. If found, the
  // very first profile the user creates inherits it instead of starting
  // empty — see finishProfileCreation().
  async function checkLegacyMigration(){
    var sRaw=null, lRaw=null, fRaw=null;
    try{ var s = await window.storage.get('settings'); sRaw = (s && s.value) ? s.value : null; }catch(e){}
    try{ var l = await window.storage.get('logs'); lRaw = (l && l.value) ? l.value : null; }catch(e){}
    try{ var f = await window.storage.get('favorites'); fRaw = (f && f.value) ? f.value : null; }catch(e){}
    if(!sRaw && usingLocalFallback) sRaw = await idbGet('settings');
    if(!lRaw && usingLocalFallback) lRaw = await idbGet('logs');
    if(!fRaw && usingLocalFallback) fRaw = await idbGet('favorites');
    if(sRaw || lRaw){
      legacyStash = { settings: sRaw, logs: lRaw, favorites: fRaw };
      authIsMigration = true;
    }
    authView = 'username';
  }

  async function finishProfileCreation(newProfile){
    profiles.push(newProfile);
    await saveProfiles();
    activeProfileId = newProfile.id;
    if(authIsMigration && legacyStash){
      if(legacyStash.settings){ await window.storage.set('settings:'+activeProfileId, legacyStash.settings, false); if(usingLocalFallback) idbSet('settings:'+activeProfileId, legacyStash.settings); }
      if(legacyStash.logs){ await window.storage.set('logs:'+activeProfileId, legacyStash.logs, false); if(usingLocalFallback) idbSet('logs:'+activeProfileId, legacyStash.logs); }
      if(legacyStash.favorites){ await window.storage.set('favorites:'+activeProfileId, legacyStash.favorites, false); if(usingLocalFallback) idbSet('favorites:'+activeProfileId, legacyStash.favorites); }
    }
    authIsMigration = false;
    legacyStash = null;
    authView = null;
    authMode = null;
    authPin = [];
    authPendingPlain = null;
    authError = '';
    await loadState();
    render();
  }

  function nutrientCoverage(windowN){

  // Picks up to 3 items that fit the remaining calorie budget, trying to
  // cover as many of the three target nutrients as possible across the
  // picks rather than returning three items that all hit the same one.
  // A small margin (remainingBudget + 60) is allowed since these are
  // suggestions, not a hard commitment, and whole-food portions are lumpy.
  function suggestNutrientFoods(remainingBudget, priorityNutrient){
    var margin = 60;
    var candidates = NUTRIENT_FOODS.filter(function(f){ return f.cals <= remainingBudget + margin; });
    if(!candidates.length) return [];
    // Shuffle rather than sort-by-calories: sorting cheapest-first made
    // this deterministically suggest the same 2-3 lowest-calorie items
    // (usually spinach twice) whenever the budget was generous. A fresh
    // shuffle each call means a real variety of the list gets surfaced
    // over repeated use, while still respecting the budget filter above.
    candidates = candidates.slice();
    for(var i=candidates.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=candidates[i]; candidates[i]=candidates[j]; candidates[j]=tmp;
    }
    if(priorityNutrient){
      // Targeted mode (from the nutrient coverage panel): fill as many
      // slots as possible from foods that hit the specific weak nutrient,
      // only falling back to the general pool if there aren't 3 that fit.
      var primary = candidates.filter(function(f){ return f.nutrients.indexOf(priorityNutrient) !== -1; });
      var rest = candidates.filter(function(f){ return f.nutrients.indexOf(priorityNutrient) === -1; });
      var targeted = primary.slice(0,3);
      var ri = 0;
      while(targeted.length < 3 && ri < rest.length){ targeted.push(rest[ri]); ri++; }
      return targeted.slice(0,3);
    }
    var picks = [];
    // First pass: greedily cover each of the three nutrients at least once.
    ['folate','iron','potassium'].forEach(function(nutrient){
      if(picks.length >= 3) return;
      var match = candidates.find(function(f){
        return f.nutrients.indexOf(nutrient) !== -1 && picks.indexOf(f) === -1;
      });
      if(match) picks.push(match);
    });
    // Fill any remaining slots with whatever's left of the shuffled list.
    for(var k=0;k<candidates.length && picks.length < 3; k++){
      if(picks.indexOf(candidates[k]) === -1) picks.push(candidates[k]);
    }
    return picks.slice(0,3);
  }

  function ensureDay(dateStr){
    if(!logs[dateStr]) logs[dateStr] = { food: [], exercise: [], weight: null, water: 0 };
    if(!logs[dateStr].food) logs[dateStr].food = [];
    if(!logs[dateStr].exercise) logs[dateStr].exercise = [];

  // ---------------- calc ----------------
  function hasBaselineInputs(s){
    return s && s.sex && s.age && s.heightCm && s.weightKg;
  }
  function computeBMR(s){
    if(!hasBaselineInputs(s)) return null;
    var base = 10*s.weightKg + 6.25*s.heightCm - 5*s.age;
    return s.sex === 'male' ? base + 5 : base - 161;
  }
  function computeBaseline(s){
    var bmr = computeBMR(s);
    if(bmr == null) return null;
    if(s.baselineMode === 'tdee'){
      return bmr * (s.activityMultiplier || 1.2);
    }
    return bmr;
  }
  // Daily water target. When full baseline stats are set, uses the standard
  // clinical rule of thumb of ~1 ml of water per kcal of total energy expenditure
  // (so it reflects age, weight, height and sex the same way the BMR calc does,
  // scaled by activity level). Falls back to a plain 33 ml/kg estimate if only
  // weight is known, and to a flat population-average default otherwise.
  function computeWaterGoalMl(s){
    var bmr = computeBMR(s);
    if(bmr != null){
      var tdee = bmr * (s.activityMultiplier || 1.375);
      return Math.round(tdee);
    }
    if(s && s.weightKg){
      return Math.round(s.weightKg * 33);
    }
    return 2200;
  }
  function dayTotals(dateStr){
    var day = logs[dateStr] || { food:[], exercise:[], weight:null };
    var intake = (day.food||[]).reduce(function(a,f){ return a+f.cals; }, 0);
    var exBurn = (day.exercise||[]).reduce(function(a,e){ return a+e.cals; }, 0);
    var baseline = computeBaseline(settings);
    var totalBurn = (baseline||0) + exBurn;
    // balance = intake - totalBurn: NEGATIVE means you ate less than you
    // burned (a deficit -- the "good" direction for weight loss), POSITIVE
    // means you ate more than you burned (a surplus). This matches how
    // people actually read a signed deficit/surplus number -- deficit
    // feels like "negative", not "positive" -- even though it's the
    // opposite of the intuitive "credit/debit ledger" framing the rest of
    // this app uses elsewhere. Every consumer of dayTotals().balance
    // (avgBalance, cumulativeBalance, physiqueState, quests, the chart,
    // the summary cards, the trend cell) was updated for this convention
    // when it was introduced -- if you add a new consumer, negative means
    // deficit/good, positive means surplus/bad.
    var balance = intake - totalBurn;
    return { intake:intake, exBurn:exBurn, baseline:baseline, totalBurn:totalBurn, balance:balance, hasBaseline: baseline != null, tracked: (day.food.length>0 || day.exercise.length>0) };
  }
  function trackedDatesSorted(){
    return Object.keys(logs).filter(function(d){
      var day = logs[d];
      return day && ((day.food && day.food.length) || (day.exercise && day.exercise.length) || day.weight != null);
    }).sort();
  }

  function shouldShowBackupReminder(){

    if(reminderDismissed) return false;

    var last = settings.lastExportAt;
    if(!last) return true;

    return daysSince >= 3;

  function backupReminderText(){
    if(!settings.lastExportAt) return "You haven't exported a backup yet — a quick safety net against your phone clearing local data.";
    var days = Math.floor((Date.now() - settings.lastExportAt) / 86400000);

  function lastNTrackedDates(n){
    var dates = trackedDatesSorted();
    var upTo = dates.filter(function(d){ return d <= currentDate; });
    return upTo.slice(Math.max(0, upTo.length - n));
  }
  function avgBalance(n){
    var dates = lastNTrackedDates(n).filter(function(d){ return dayTotals(d).tracked; });
    if(!dates.length) return null;
    var sum = dates.reduce(function(a,d){ return a + dayTotals(d).balance; }, 0);
    return sum / dates.length;
  }
  // Separate intake/exercise averages (not just the net balance) are what
  // the projection below actually needs: it holds *these* steady and lets
  // the baseline burn recompute itself each simulated day, rather than
  // assuming today's net deficit stays constant for months.
  function avgIntake(n){
    var dates = lastNTrackedDates(n).filter(function(d){ return dayTotals(d).tracked; });
    if(!dates.length) return null;
    var sum = dates.reduce(function(a,d){ return a + dayTotals(d).intake; }, 0);
    return sum / dates.length;
  }
  function avgExerciseBurn(n){
    var dates = lastNTrackedDates(n).filter(function(d){ return dayTotals(d).tracked; });
    if(!dates.length) return null;
    var sum = dates.reduce(function(a,d){ return a + dayTotals(d).exBurn; }, 0);
    return sum / dates.length;
  }
  function cumulativeBalance(){
    var dates = trackedDatesSorted().filter(function(d){ return d <= currentDate && dayTotals(d).tracked; });
    return dates.reduce(function(a,d){ return a + dayTotals(d).balance; }, 0);
  }
  function unitLabel(){ return ((settings.units || 'imperial') === 'imperial') ? 'lb' : 'kg'; }
  function kcalToWeightUnit(kcal){
    return (settings.units || 'imperial') === 'imperial' ? kcal * LB_PER_KCAL : kcal * KG_PER_KCAL;
  }
  function kgToDisplayWeight(kg){
    return (settings.units || 'imperial') === 'imperial' ? kg / 0.453592 : kg;

  // ---------------- weight projection (BMR-adaptive) ----------------
  // A flat "avg daily deficit x N days" projection is wrong for anything
  // longer than a week or two: BMR is a function of body weight, so as
  // someone loses weight, the same eating/exercise pattern burns fewer
  // calories per day and the real-world rate of loss tapers off. This
  // walks the projection forward one simulated day at a time, holding
  // recent average intake and exercise steady but recomputing BMR from
  // the *projected* weight at each step -- so a 90-day estimate reflects
  // a shrinking deficit, not a straight line off a cliff.
  //
  // This still isn't a full physiological model (real metabolic
  // adaptation goes beyond what a lower body weight alone predicts,
  // water-weight fluctuation isn't modeled, etc.) -- it's a meaningfully
  // better approximation than static linear extrapolation, not a
  // medical-grade forecast. Keep the UI copy honest about that.
  function simulateForward(days, windowN){
    if(!hasBaselineInputs(settings)) return null;
    var avgIn = avgIntake(windowN);
    if(avgIn == null) return null; // nothing tracked yet to project from
    var avgEx = avgExerciseBurn(windowN) || 0;
    var s = settings;
    var weight = s.weightKg;
    var path = [weight];
    for(var i=0;i<days;i++){
      var bmr = computeBMR({ sex:s.sex, age:s.age, heightCm:s.heightCm, weightKg:weight });
      var baseline = (s.baselineMode === 'tdee') ? bmr * (s.activityMultiplier || 1.2) : bmr;
      var dailyBalance = (baseline + avgEx) - avgIn; // positive = deficit = loss
      weight = weight - dailyBalance * KG_PER_KCAL;
      if(weight < 30) { weight = 30; path.push(weight); break; } // sanity floor
      path.push(weight);
    }
    return { startWeightKg: s.weightKg, endWeightKg: weight, deltaKg: weight - s.weightKg, days: path.length - 1, path: path };
  }
  // Same day-by-day simulation, but run until goal weight is crossed
  // (instead of for a fixed number of days) -- so the ETA also reflects
  // a shrinking deficit as weight approaches goal, rather than dividing
  // total kcal needed by today's flat average rate.
  function simulateDaysToGoal(windowN, maxDays){
    if(!hasBaselineInputs(settings) || !settings.goalWeightKg) return null;
    var avgIn = avgIntake(windowN);
    if(avgIn == null) return null;
    var avgEx = avgExerciseBurn(windowN) || 0;
    var s = settings;
    var weight = s.weightKg;
    var goal = s.goalWeightKg;
    var losing = goal < weight;
    if(weight === goal) return 0;
    for(var i=1;i<=maxDays;i++){
      var bmr = computeBMR({ sex:s.sex, age:s.age, heightCm:s.heightCm, weightKg:weight });
      var baseline = (s.baselineMode === 'tdee') ? bmr * (s.activityMultiplier || 1.2) : bmr;
      var dailyBalance = (baseline + avgEx) - avgIn;
      weight = weight - dailyBalance * KG_PER_KCAL;
      if(losing && weight <= goal) return i;
      if(!losing && weight >= goal) return i;
      // Direction is wrong (trending away from goal) or has essentially
      // stalled -- bail out rather than loop pointlessly to maxDays.
      if(losing && dailyBalance <= 0.5 && i > 14) return null;
      if(!losing && dailyBalance >= -0.5 && i > 14) return null;
    }
    return null; // wouldn't arrive within maxDays at this rate
  }

  // ---------------- AI estimation ----------------
  async function callClaudeAPI(systemPrompt, userPrompt, opts){
    opts = opts || {};
    var body = {
      model: 'claude-sonnet-4-6',
      max_tokens: opts.maxTokens || 300,
      system: systemPrompt,
      messages: [{ role: 'user', content: userPrompt }]
    };
    if(opts.tools) body.tools = opts.tools;
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('request failed');
    var data = await res.json();
    // With web_search enabled, content can include search/tool-use blocks
    // before the final answer — take the LAST text block, not the first.
    var textBlocks = (data.content || []).filter(function(b){ return b.type === 'text'; });
    if(!textBlocks.length) throw new Error('no text in response');
    var lastText = textBlocks[textBlocks.length - 1].text;

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  function physiqueState(){
    var dates = trackedDatesSorted().filter(function(d){ return d <= currentDate && dayTotals(d).tracked; });

    var avg = avgBalance(n);
    if(avg == null) return { score: 0, days: 0, avg: null };
    // avg is now negative-for-deficit already (see dayTotals), which is
    // exactly the direction this score wants (negative score = lean/
    // credit-colored) -- no negation needed here anymore.
    var score = clamp(avg / 300, -3, 3);
    return { score: score, days: n, avg: avg };
  }

    var credit = [95,184,138], gold = [201,164,76], debit = [196,99,79];

                      : [0,1,2].map(function(i){ return lerp(gold[i], debit[i], (t-0.5)/0.5); });
    return 'rgb(' + c.map(function(v){ return Math.round(v); }).join(',') + ')';
  }

  function pickMotivationalQuote(){

  function todaysWorkoutQuote(){

  function exercisesForDayType(dayType){
    return Object.keys(WORKOUT_EXERCISES).filter(function(k){ return WORKOUT_EXERCISES[k].dayType === dayType; });
  }
  function currentWorkoutDayType(){
    var idx = settings.workoutDayIndex;
    if(typeof idx !== 'number' || idx < 0 || idx >= WORKOUT_DAY_TYPES.length) idx = 0;
    return WORKOUT_DAY_TYPES[idx];
  }

  function ensureWorkoutProgress(){
    if(!settings.workoutProgress) settings.workoutProgress = {};
    Object.keys(WORKOUT_EXERCISES).forEach(function(key){
      if(!settings.workoutProgress[key]){
        settings.workoutProgress[key] = { variantIndex: 0, reps: WORKOUT_START_REPS };
      }
    });
    return settings.workoutProgress;
  }

  function workoutTaskName(){
    var progress = ensureWorkoutProgress();
    var keys = exercisesForDayType(currentWorkoutDayType());
    var parts = keys.map(function(key){
      var def = WORKOUT_EXERCISES[key];
      var cur = progress[key];
      return cur.reps + ' ' + def.variants[cur.variantIndex].toLowerCase();
    });
    return 'Do ' + parts.join(' + ');
  }

  function workoutExerciseCalories(key, reps){
    var def = WORKOUT_EXERCISES[key];
    var weight = settings.weightKg || 70;
    return Math.round(def.calsPerRepAt70kg * reps * (weight / 70));
  }

  // feedback is 'easy' or 'hard'. Reps are rounded to the nearest 5 for a
  // cleaner target number, with a guaranteed minimum bump on "easy" so
  // rounding never silently leaves the target unchanged.
  function advanceWorkoutStep(current, key, feedback){
    var def = WORKOUT_EXERCISES[key];
    if(feedback === 'hard'){
      return { variantIndex: current.variantIndex, reps: current.reps };
    }
    var factor = 1.25 + Math.random() * 0.15; // 25%-40% increase
    var raised = Math.round((current.reps * factor) / 5) * 5;
    if(raised < current.reps + 5) raised = current.reps + 5;
    if(raised >= WORKOUT_LEVEL_UP_AT){
      var nextIdx = current.variantIndex + 1;
      if(nextIdx >= def.variants.length){
        // Already at the hardest variation -- cap at 100, nowhere harder to go.
        return { variantIndex: current.variantIndex, reps: WORKOUT_LEVEL_UP_AT };
      }
      return { variantIndex: nextIdx, reps: WORKOUT_START_REPS };
    }
    return { variantIndex: current.variantIndex, reps: raised };
  }

  // ---------------- fitness self-assessment ----------------
  // A short, honest starting point instead of assigning everyone a flat
  // 10 reps regardless of actual fitness level. Grounded in published
  // push-up norms (beginners ~5, "average" 20s-somethings ~17-29,
  // advanced 40+) rather than made up -- see CLAUDE.md for sources.
  // Produces a 0-4 tier from three quick self-reports (push-up capacity,
  // squat capacity, current activity frequency) and maps that tier to a
  // starting rep count PER EXERCISE, since different movements have very
  // different natural baselines (e.g. dips are harder than push-ups at
  // the same fitness level; supermans/crunches are easier).
  var FITNESS_PUSHUP_BANDS = [
    { max:2,  tier:0, label:'0-2' },
    { max:9,  tier:1, label:'3-9' },
    { max:19, tier:2, label:'10-19' },
    { max:34, tier:3, label:'20-34' },
    { max:Infinity, tier:4, label:'35+' }
  ];
  var FITNESS_SQUAT_BANDS = [
    { max:9,  tier:0, label:'0-9' },
    { max:19, tier:1, label:'10-19' },
    { max:34, tier:2, label:'20-34' },
    { max:49, tier:3, label:'35-49' },
    { max:Infinity, tier:4, label:'50+' }
  ];
  var FITNESS_ACTIVITY_BANDS = [
    { tier:0, label:'Not currently active' },
    { tier:1, label:'1-2 days a week' },
    { tier:2, label:'3-4 days a week' },
    { tier:3, label:'5+ days a week' }
  ];
  // Starting reps per exercise per tier (0=beginner .. 4=very fit),
  // rounded to the nearest 5 for consistency with the progression system.
  var WORKOUT_TIER_START_REPS = {
    pushups:     [5, 10, 15, 25, 35],
    dips:        [5, 8, 10, 15, 25],
    squats:      [8, 10, 15, 25, 35],
    lunges:      [5, 10, 12, 20, 30],
    rows:        [5, 8, 10, 15, 25],
    supermans:   [8, 10, 15, 20, 30],
    pikepushups: [5, 8, 10, 15, 25],

  function computeFitnessTier(pushupTier, squatTier, activityTier){
    return Math.round((pushupTier + squatTier + activityTier) / 3);
  }
  function applyFitnessAssessment(pushupTier, squatTier, activityTier){
    var tier = computeFitnessTier(pushupTier, squatTier, activityTier);
    var progress = ensureWorkoutProgress();
    Object.keys(WORKOUT_TIER_START_REPS).forEach(function(key){
      progress[key] = { variantIndex: 0, reps: WORKOUT_TIER_START_REPS[key][tier] };
    });
    settings.fitnessAssessment = { pushupTier:pushupTier, squatTier:squatTier, activityTier:activityTier, tier:tier, takenAt: Date.now() };
    settings.workoutDayIndex = 0;
    return tier;
  }

  function questsForDay(dateStr){
    var t = dayTotals(dateStr);
    var day = logs[dateStr] || { food:[], exercise:[], weight:null };
    var goal = settings.goal || 'maintain';
    var goalQuest;
    if(goal === 'lose'){
      goalQuest = { name:'Finish the day in a deficit', done: t.tracked && t.balance < 0, xp: 25 };
    } else if(goal === 'gain'){
      goalQuest = { name:'Finish the day in a surplus', done: t.tracked && t.balance > 0, xp: 25 };
    } else {
      goalQuest = { name:'Stay within 200 kcal of even', done: t.tracked && Math.abs(t.balance) <= 200, xp: 25 };
    }
    // Use the snapshot of what was actually assigned/completed on this
    // specific day if it exists, rather than always showing today's live
    // target -- otherwise viewing a past day after the target has since
    // changed (progressed or leveled up) would misrepresent what that
    // day's task actually was.
    var workoutName;
    if(day.workoutTask && day.workoutTask.snapshot){
      var snap = day.workoutTask.snapshot;
      workoutName = 'Do ' + Object.keys(snap).map(function(k){ return snap[k].reps + ' ' + snap[k].variant.toLowerCase(); }).join(' + ');
    } else {
      workoutName = workoutTaskName();
    }

    return [
      { name:'Log at least two meals', done: (day.food||[]).length >= 2, xp: 10 },
      { name: workoutName, done: !!(day.workoutTask && day.workoutTask.done), xp: 15 },
      goalQuest,
      { name:'Log today\'s weight', done: day.weight != null, xp: 10 }
    ];
  }

  function xpForDay(dateStr){
    return questsForDay(dateStr).reduce(function(sum,q){ return sum + (q.done ? q.xp : 0); }, 0);
  }

  function totalXP(){
    return Object.keys(logs).reduce(function(sum, d){
      if(!dayTotals(d).tracked) return sum;
      return sum + xpForDay(d);
    }, 0);
  }

  function levelInfo(){
    var xp = totalXP();
    var level = 1 + Math.floor(Math.sqrt(xp / 40));
    var xpForLevel = function(l){ return Math.pow(l-1, 2) * 40; };
    var curFloor = xpForLevel(level);
    var nextFloor = xpForLevel(level+1);
    var progress = nextFloor > curFloor ? (xp - curFloor) / (nextFloor - curFloor) : 1;
    var titles = [
      [1,'Novice'], [3,'Adept'], [6,'Vanguard'], [10,'Elite'], [15,'Ascendant']
    ];
    var title = titles[0][1];
    titles.forEach(function(t){ if(level >= t[0]) title = t[1]; });
    return { xp:xp, level:level, curFloor:curFloor, nextFloor:nextFloor, progress:clamp(progress,0,1), title:title };
  }

  function currentStreak(){
    var d = todayStr();
    var streak = 0;
    while(dayTotals(d).tracked){
      streak++;
      d = addDays(d, -1);
    }
    return streak;
  }

  function statBars(){
    var last14 = lastNDates(14);
    var trackedCount = last14.filter(function(d){ return dayTotals(d).tracked; }).length;
    var consistency = Math.round((trackedCount / 14) * 100);

    var last7 = lastNDates(7);
    var exerciseSum = last7.reduce(function(sum,d){ return sum + dayTotals(d).exBurn; }, 0);
    var power = Math.round(clamp(exerciseSum / 3000, 0, 1) * 100);

    var trackedLast14 = last14.filter(function(d){ return dayTotals(d).tracked; });
    var metGoal = trackedLast14.filter(function(d){
      var qs = questsForDay(d);
      return qs[2].done;
    }).length;
    var control = trackedLast14.length ? Math.round((metGoal / trackedLast14.length) * 100) : 0;

    return [
      { label:'Consistency', value:consistency, color:'var(--gold)' },
      { label:'Power', value:power, color:'var(--gold)' },
      { label:'Control', value:control, color:'var(--gold)' }
    ];
  }

  function lastNDates(n){
    var out = [];
    var d = todayStr();
    for(var i=0;i<n;i++){ out.unshift(d); d = addDays(d,-1); }
    return out;
  }

  function renderSummary(t){
    var bmrVal = computeBMR(settings);

    var burnedSub;
    if(t.hasBaseline){
      burnedSub = (settings.baselineMode === 'tdee')
        ? ('BMR ' + round(bmrVal) + ' &times; ' + (settings.activityMultiplier||1.2) + ' activity + ' + round(t.exBurn) + ' exercise')
        : ('BMR ' + round(bmrVal) + ' + ' + round(t.exBurn) + ' exercise');
    } else {
      burnedSub = 'no baseline set — only exercise counted';
    }

    // "Budget left" = totalBurn - intake: how many more calories you can
    // eat today before you've used up everything you've burned. Positive
    // = room left (green), negative = you've gone over (red). This is a
    // different framing from "Balance" below on purpose -- one is an
    // actionable "how much more can I eat" number, the other is a signed
    // deficit/surplus reading of the day so far.
    var budgetLeft = t.totalBurn - t.intake;
    var budgetClass = budgetLeft >= 0 ? 'credit' : 'debit';
    var budgetDisplay = budgetLeft >= 0 ? round(budgetLeft) : ('&minus;' + Math.abs(round(budgetLeft)));
    var budgetSub = round(t.totalBurn) + ' budget &minus; ' + round(t.intake) + ' eaten';

    // Balance = intake - totalBurn: negative = deficit (good), positive =
    // surplus (bad) -- see the comment on dayTotals() for why this is the
    // opposite sign of "budget left" above even though it's the same two
    // underlying numbers.
    var balanceClass = t.balance <= 0 ? 'credit' : 'debit';
    var balanceWord = t.balance <= 0 ? 'deficit' : 'surplus';

    return (
      '<div class="summary">' +
        '<div class="cell"><div class="label">Eaten</div><div class="value debit num">' + round(t.intake) + '</div><div class="sub">' + (logs[currentDate]?(logs[currentDate].food||[]).length:0) + ' entries</div></div>' +
        '<div class="cell"><div class="label">Burned</div><div class="value credit num">' + round(t.totalBurn) + '</div><div class="sub">' + burnedSub + '</div></div>' +
        '<div class="cell"><div class="label">Budget left</div><div class="value ' + budgetClass + ' num">' + budgetDisplay + '</div><div class="sub">' + budgetSub + '</div></div>' +
        '<div class="cell"><div class="label">Balance</div><div class="value ' + balanceClass + ' num">' + sign(t.balance) + Math.abs(round(t.balance)) + '</div><div class="sub">' + balanceWord + ' today</div></div>' +
        '<div class="cell"><div class="label">Running balance</div><div class="value num">' + renderRunningBalance() + '</div><div class="sub">since first entry</div></div>' +
      '</div>'
    );
  }

    return '<span class="' + cls + '">' + sign(cum) + Math.abs(round(cum)) + '</span>';
  }

  function renderWorkoutTask(){
    var progress = ensureWorkoutProgress();
    var day = logs[currentDate];
    var isToday = currentDate === todayStr();
    var taskDoneToday = day && day.workoutTask && day.workoutTask.done;
    var dayType = currentWorkoutDayType();
    var dayLabel = WORKOUT_DAY_LABELS[dayType];

    var targetLine = exercisesForDayType(dayType).map(function(key){
      var def = WORKOUT_EXERCISES[key];
      var cur = progress[key];
      return def.variants[cur.variantIndex] + ' &times; ' + cur.reps;
    }).join(' &nbsp;+&nbsp; ');

    var html = '<div class="workout-task">';
    html += '<div class="workout-task-head"><h2>Today\'s workout</h2><span class="workout-day-tag">' + esc(dayLabel) + ' day</span></div>';

    if(taskDoneToday){
      var snap = day.workoutTask.snapshot;
      var doneDayLabel = WORKOUT_DAY_LABELS[day.workoutTask.dayType] || dayLabel;
      var doneLine = Object.keys(snap).map(function(k){ return esc(snap[k].variant) + ' &times; ' + snap[k].reps; }).join(' + ');
      html += '<div class="workout-task-target workout-task-target-done">' + esc(doneDayLabel) + ': ' + doneLine + '</div>';
      html += '<div class="workout-task-feedback-tag">Completed — felt ' + esc(day.workoutTask.feedback) + '</div>';
    } else if(!isToday){
      html += '<div class="workout-task-target">' + targetLine + '</div>';
      html += '<div class="trend-empty">This task is only tracked for today — jump to today to complete it.</div>';
    } else if(workoutFeedbackPending){
      html += '<div class="workout-task-target">' + targetLine + '</div>';
      html += '<div class="workout-feedback-prompt">How did that feel?</div>';
      html += '<div class="workout-feedback-actions">' +
        '<button class="workout-feedback-btn easy" onclick="App.completeWorkoutTask(\'easy\')">Easy — raise it next time</button>' +
        '<button class="workout-feedback-btn hard" onclick="App.completeWorkoutTask(\'hard\')">Hard — keep it here</button>' +
      '</div>' +
      '<button class="workout-task-cancel" onclick="App.cancelWorkoutFeedback()">Cancel</button>';
    } else {
      html += '<div class="workout-task-target">' + targetLine + '</div>';
      html += '<button class="workout-task-btn" onclick="App.startWorkoutFeedback()">Mark today\'s workout done</button>';
    }
    html += '</div>';
    return html;
  }

  function flaskSVG(pct, accent){
    pct = clamp(pct, 0, 1);
    var neckTop = 8, neckBot = 42, bulbBot = 150;
    var liquidTop = bulbBot - (bulbBot - 22) * pct;
    var flaskPath = 'M48,'+neckTop+' L72,'+neckTop+' L72,'+neckBot+' C95,'+(neckBot+10)+' 105,90 100,120 C97,140 85,150 60,150 C35,150 23,140 20,120 C15,90 25,'+(neckBot+10)+' 48,'+neckBot+' Z';
    var liquidGroup = '';
    if(pct > 0.015){
      var wave = 'M20,'+liquidTop.toFixed(1)+' C 35,'+(liquidTop-4).toFixed(1)+' 45,'+(liquidTop+4).toFixed(1)+' 60,'+liquidTop.toFixed(1)+' C 75,'+(liquidTop-4).toFixed(1)+' 85,'+(liquidTop+4).toFixed(1)+' 100,'+liquidTop.toFixed(1)+' L100,160 L20,160 Z';
      liquidGroup = '<g clip-path="url(#flaskClip)">' +
        '<path d="'+wave+'" fill="'+accent+'" opacity="0.85"/>' +
        '<circle cx="45" cy="'+(liquidTop+25).toFixed(1)+'" r="2.5" fill="#ffffff" opacity="0.4"/>' +
        '<circle cx="68" cy="'+(liquidTop+40).toFixed(1)+'" r="1.8" fill="#ffffff" opacity="0.3"/>' +
      '</g>';
    }
    return (
      '<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><clipPath id="flaskClip"><path d="'+flaskPath+'"/></clipPath></defs>' +
        liquidGroup +
        '<path d="'+flaskPath+'" fill="none" stroke="#5a6b85" stroke-width="2.5"/>' +
      '</svg>'
    );
  }

  function renderHydration(){
    var day = ensureDay ? (logs[currentDate] || { water: 0 }) : { water: 0 };
    var have = (logs[currentDate] && typeof logs[currentDate].water === 'number') ? logs[currentDate].water : 0;
    var goal = computeWaterGoalMl(settings);
    var pct = goal > 0 ? have / goal : 0;
    var accent = '#5fa8d3';
    var metGoal = have >= goal;

  function renderNutrientCoverage(){
    var cov = nutrientCoverage(7);
    if(cov.days === 0){
      return (
        '<div class="nutrient-coverage">' +
          '<div class="nutrient-coverage-head"><h2>Nutrient coverage</h2></div>' +
          '<div class="trend-empty">Log a few days of food to see which nutrients you\'re getting consistently.</div>' +
        '</div>'
      );
    }
    var rows = ['folate','iron','potassium'].map(function(n){
      var c = cov[n];
      var pct = cov.days ? c / cov.days : 0;
      var barColor = pct >= 0.57 ? 'var(--credit)' : (pct >= 0.29 ? 'var(--gold)' : 'var(--debit)');
      return '<div class="nutrient-cov-row">' +
        '<span class="nutrient-cov-label">' + NUTRIENT_LABELS[n] + '</span>' +
        '<div class="nutrient-cov-bar-outer"><div class="nutrient-cov-bar-inner" style="width:' + Math.round(pct*100) + '%;background:' + barColor + ';"></div></div>' +
        '<span class="nutrient-cov-count num">' + c + '/' + cov.days + '</span>' +
      '</div>';
    }).join('');
    var weakest = ['folate','iron','potassium'].reduce(function(a,b){ return cov[a] <= cov[b] ? a : b; });
    return (
      '<div class="nutrient-coverage">' +
        '<div class="nutrient-coverage-head"><h2>Nutrient coverage (' + cov.days + 'd)</h2></div>' +
        rows +
        '<div class="nutrient-cov-note">Counts days with at least one food tagged as a source — a rough signal from what you\'ve logged and how you described it, not a lab measurement.</div>' +
        '<button class="nutrient-cov-suggest-btn" onclick="App.suggestForNutrient(\'' + weakest + '\')">Suggest ' + NUTRIENT_LABELS[weakest] + '-rich foods</button>' +
