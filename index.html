  function renderTrend(){
    var chartDates = lastNTrackedDates(14).filter(function(d){return dayTotals(d).tracked;});

    if(!chartDates.length){
      return (
        '<div class="trend">' +
          '<div class="trend-head"><h2>Trend &amp; projection</h2></div>' +
          '<div class="trend-empty">Log a few days of food and exercise to see your trend and projection.</div>' +
        '</div>'
      );
    }

    var avg7 = avgBalance(7);
    var avg30 = avgBalance(30);
    var activeAvg = trendWindow === 7 ? avg7 : avg30;

    var hasBaseline = hasBaselineInputs(settings);
    var proj7 = simulateForward(7, trendWindow);
    var proj30 = simulateForward(30, trendWindow);
    var proj90 = simulateForward(90, trendWindow);

    function projCell(label, proj){
      if(!proj){
        return '<div class="cell"><div class="label">'+label+'</div><div class="value">—</div></div>';
      }
      var deltaDisp = kgToDisplayWeight(proj.deltaKg);
      var endDisp = kgToDisplayWeight(proj.endWeightKg);
      var cls = deltaDisp < 0 ? 'credit' : (deltaDisp > 0 ? 'debit' : '');
      return '<div class="cell"><div class="label">'+label+'</div>' +
        '<div class="value '+cls+'">'+sign(deltaDisp)+Math.abs(Math.round(deltaDisp*10)/10)+' '+unitLabel()+'</div>' +
        '<div class="sub">&rarr; '+(Math.round(endDisp*10)/10)+' '+unitLabel()+'</div></div>';
    }

    var etaText;
    if(!hasBaseline){
      etaText = 'Add your stats in settings to see a projection.';
    } else if(!settings.goalWeightKg){
      etaText = 'Set a goal weight in settings to see an ETA.';
    } else if(settings.weightKg === settings.goalWeightKg){
      etaText = "You're already at your goal weight.";
    } else {
      var daysToGoal = simulateDaysToGoal(trendWindow, 1095);
      if(daysToGoal == null){
        etaText = "At your recent average, you're not on track to reach your goal weight — the trend is flat or moving the other way.";
      } else {
        var etaDate = new Date(Date.now() + daysToGoal*86400000);
        etaText = 'At this rate, goal weight around ' + etaDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' (~' + daysToGoal + ' days).';
      }
    }

    var projectionSection = hasBaseline ? (
      '<div class="trend-projection">' +
        '<div class="trend-projection-label">If you keep up your ' + trendWindow + '-day average&hellip;</div>' +
        '<div class="trend-stats">' +
          projCell('In 7 days', proj7) +
          projCell('In 30 days', proj30) +
          projCell('In 90 days', proj90) +
        '</div>' +
        '<div class="trend-projection-note">Recalculates your BMR each simulated day as projected weight changes — a 90-day estimate isn\'t just the 7-day rate x 13. This is a modeled estimate, not a guarantee: it doesn\'t account for water-weight swings or metabolic adaptation beyond what lower body weight alone predicts.</div>' +
      '</div>'
    ) : (
      '<div class="trend-projection">' +
        '<div class="trend-empty">Add your sex, age, height, and weight in settings to project weight change — it needs your BMR to model how your burn shifts as weight changes.</div>' +
      '</div>'
    );

    return (
      '<div class="trend">' +
        '<div class="trend-head">' +
          '<h2>Trend &amp; projection</h2>' +
          '<div class="window-toggle">' +
            '<button class="' + (trendWindow===7?'active':'') + '" onclick="App.setWindow(7)">7-day avg</button>' +
            '<button class="' + (trendWindow===30?'active':'') + '" onclick="App.setWindow(30)">30-day avg</button>' +
          '</div>' +
        '</div>' +
        '<div class="chart-wrap">' + renderChart(chartDates) + '</div>' +
        '<div class="cell trend-balance-cell"><div class="label">Avg daily balance (' + trendWindow + 'd)</div><div class="value ' + (activeAvg<=0?'credit':'debit') + '">' + (activeAvg!=null?(sign(activeAvg)+Math.abs(round(activeAvg))):'—') + '</div></div>' +
        projectionSection +
        '<div class="cell trend-eta-cell"><div class="label">Goal ETA</div><div class="value" style="font-size:12.5px;font-weight:400;line-height:1.5;">' + etaText + '</div></div>' +
      '</div>'
    );
  }

  function renderChart(dates){
    var W = 640, H = 160, padL = 30, padR = 10, padTop = 10, padBot = 20;
    var innerW = W - padL - padR;
    var zeroY = padTop + (H - padTop - padBot) / 2;
    var vals = dates.map(function(d){ return dayTotals(d).balance; });
    var maxAbs = Math.max.apply(null, vals.map(Math.abs).concat([200]));
    var scale = ((H - padTop - padBot)/2) / (maxAbs * 1.15);
    var barW = Math.min(28, innerW / dates.length * 0.6);
    var gap = innerW / dates.length;

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;overflow:visible;">';
    svg += '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W-padR) + '" y2="' + zeroY + '" stroke="var(--border)" stroke-width="1"/>';
    dates.forEach(function(d, i){
      var v = dayTotals(d).balance;
      var x = padL + gap*i + (gap-barW)/2;
      var h = Math.abs(v) * scale;
      // v is negative for a deficit -- keep that drawing UP (the intuitive
      // "good" direction) and green, same visual as before the sign flip.
      var y = v <= 0 ? zeroY - h : zeroY;
      var color = v <= 0 ? 'var(--credit)' : 'var(--debit)';
      svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h,1) + '" fill="' + color + '" rx="1"/>';
      var dd = new Date(d+'T00:00:00Z');
      var lbl = dd.toLocaleDateString(undefined,{day:'numeric',timeZone:'UTC'});
      svg += '<text x="' + (x+barW/2) + '" y="' + (H-4) + '" text-anchor="middle" font-size="9" fill="var(--text-faint)" font-family="IBM Plex Mono, monospace">' + lbl + '</text>';
    });
    svg += '</svg>';
    return svg;
  }

  App.saveSettingsFromForm = async function(){
    var units = settings.units || 'imperial';
    var age = parseFloat(document.getElementById('f_age').value);
    var sex = settings.sex;
    var weightKg, heightCm, goalWeightKg;

    if(units === 'imperial'){
      var wLb = parseFloat(document.getElementById('f_weight').value);
      var ft = parseFloat(document.getElementById('f_heightFt').value) || 0;
      var inch = parseFloat(document.getElementById('f_heightIn').value) || 0;
      var gwLb = parseFloat(document.getElementById('f_goalWeight').value);
      weightKg = isNaN(wLb) ? null : wLb * 0.453592;
      heightCm = (ft || inch) ? (ft*12+inch)*2.54 : null;
      goalWeightKg = isNaN(gwLb) ? null : gwLb * 0.453592;
    } else {
      var wKg = parseFloat(document.getElementById('f_weight').value);
      var hCm = parseFloat(document.getElementById('f_heightCm').value);
      var gwKg = parseFloat(document.getElementById('f_goalWeight').value);
      weightKg = isNaN(wKg) ? null : wKg;
      heightCm = isNaN(hCm) ? null : hCm;
      goalWeightKg = isNaN(gwKg) ? null : gwKg;
    }

    var goal = document.getElementById('f_goal').value;
    var activityEl = document.getElementById('f_activity');
    var activityMultiplier = activityEl ? parseFloat(activityEl.value) : (settings.activityMultiplier || 1.2);

    settings = {
      units: units,
      sex: sex,
      age: isNaN(age) ? null : age,
      heightCm: heightCm,
      weightKg: weightKg,
      goalWeightKg: goalWeightKg,
      goal: goal,
      baselineMode: settings.baselineMode || 'bmr',
      activityMultiplier: activityMultiplier,
      avatarClass: settings.avatarClass,
      avatarScheme: settings.avatarScheme,
      lastExportAt: settings.lastExportAt,
      workoutProgress: settings.workoutProgress,
      workoutDayIndex: settings.workoutDayIndex,
      fitnessAssessment: settings.fitnessAssessment
    };
    await saveSettings();
    settingsOpen = false;
    render();
  };

  App.importData = async function(inputEl){
    var errEl = document.getElementById('importErr');
    if(errEl) errEl.textContent = '';
    var file = inputEl.files && inputEl.files[0];
    if(!file) return;
    try{
      var text = await file.text();
      var data = JSON.parse(text);
      if(!data || typeof data !== 'object' || !data.logs || !data.settings){
        throw new Error('bad shape');
      }
      if(!confirm('Import this backup? It will replace your current data.')) { inputEl.value = ''; return; }
      settings = data.settings || {};
      logs = data.logs || {};
      favorites = data.favorites || { food: [], exercise: [] };
      await saveSettings();
      await saveLogs();
      await saveFavorites();
      render();
    }catch(e){
      if(errEl) errEl.textContent = "Couldn't read that file — make sure it's a SoloTracker backup export.";
    }
    inputEl.value = '';
  };

  App.addEntry = async function(type){
    var nameEl = document.getElementById(type === 'food' ? 'foodName' : 'exName');
    var calEl = document.getElementById(type === 'food' ? 'foodCals' : 'exCals');
    var btn = document.getElementById(type === 'food' ? 'foodAddBtn' : 'exAddBtn');
    var errEl = document.getElementById(type === 'food' ? 'foodAddErr' : 'exAddErr');
    var name = nameEl.value.trim();
    var calsRaw = calEl.value.trim();
    if(!name) return;
    if(errEl) errEl.textContent = '';

    var day = ensureDay(currentDate);

    if(calsRaw !== ''){
      var cals = parseFloat(calsRaw);
      if(isNaN(cals)) return;
      var manualEntry = { id: uid(), name: name, cals: cals, estimated: false };
      if(type === 'food'){ var ng = guessNutrientsFromName(name); if(ng) manualEntry.nutrients = ng; }
      day[type].push(manualEntry);
      await saveLogs();
      render();
      return;
    }

    // No calories given — estimate from the description via AI.
    var originalLabel = btn.textContent;
    btn.disabled = true; nameEl.disabled = true; calEl.disabled = true;
    btn.textContent = 'Estimating…';
    try{
      var result = type === 'food'
        ? await estimateFoodCalories(name)
        : await estimateExerciseCalories(name, settings);
      var estCals = Math.round(Number(result.calories));
      if(!isFinite(estCals)) throw new Error('bad estimate');
      var label = (result.label && String(result.label).trim()) || name;
      var estEntry = { id: uid(), name: label, cals: estCals, estimated: true };
      if(type === 'food'){ var ng2 = guessNutrientsFromName(label + ' ' + name); if(ng2) estEntry.nutrients = ng2; }
      day[type].push(estEntry);
      await saveLogs();
      render();
    }catch(e){
      btn.disabled = false; nameEl.disabled = false; calEl.disabled = false; btn.textContent = originalLabel;
      if(errEl) errEl.textContent = "Couldn't estimate that — try entering calories directly.";
    }
  };

  App.deleteEntry = async function(type, id){
    var day = ensureDay(currentDate);
    day[type] = day[type].filter(function(it){ return it.id !== id; });
    await saveLogs();
    render();
  };

  App.searchFoodDb = function(v){

    if(el) el.innerHTML = renderFoodDbResultsHtml(dbSearchQuery);

  App.logDbItem = async function(id){
    var item = FOOD_DB.find(function(f){ return f.id === id; });

    var day = ensureDay(currentDate);
    var entry = { id: uid(), name: item.name + ' (' + item.unit + ')', cals: item.cals, estimated: true };

  App.saveDbItemToFavorites = async function(id){
    var item = FOOD_DB.find(function(f){ return f.id === id; });

  App.suggestHealthyFood = function(){

  App.closeNutrientSuggestions = function(){

    render();

  App.addNutrientSuggestion = async function(id){
    var item = NUTRIENT_FOODS.find(function(f){ return f.id === id; });

    day.food.push({ id: uid(), name: item.name, cals: item.cals, estimated: true, nutrients: item.nutrients.slice() });

  App.setFitnessAnswer = function(field, value){
    fitnessDraft[field] = value;
    render();

  App.submitFitnessAssessment = async function(){
    if(fitnessDraft.pushup == null || fitnessDraft.squat == null || fitnessDraft.activity == null) return;
    var pushupTier = FITNESS_PUSHUP_BANDS[fitnessDraft.pushup].tier;
    var squatTier = FITNESS_SQUAT_BANDS[fitnessDraft.squat].tier;
    var activityTier = FITNESS_ACTIVITY_BANDS[fitnessDraft.activity].tier;
    applyFitnessAssessment(pushupTier, squatTier, activityTier);
    showFitnessAssessment = false;
    fitnessDraft = { pushup: null, squat: null, activity: null };
    await saveSettings();
    render();
  };

  App.skipFitnessAssessment = async function(){
    settings.fitnessAssessment = { skipped: true, takenAt: Date.now() };
    showFitnessAssessment = false;
    fitnessDraft = { pushup: null, squat: null, activity: null };
    await saveSettings();
    render();
  };

  App.retakeFitnessAssessment = function(){
    showFitnessAssessment = true;
    fitnessDraft = { pushup: null, squat: null, activity: null };
    render();
  };

  App.startWorkoutFeedback = function(){
    workoutFeedbackPending = true;
    render();
  };

  App.cancelWorkoutFeedback = function(){
    workoutFeedbackPending = false;
    render();
  };

  App.completeWorkoutTask = async function(feedback){
    var progress = ensureWorkoutProgress();
    var day = ensureDay(currentDate);
    var dayType = currentWorkoutDayType();
    var keys = exercisesForDayType(dayType);
    var snapshot = {};

    keys.forEach(function(key){
      var def = WORKOUT_EXERCISES[key];
      var cur = progress[key];
      var cals = workoutExerciseCalories(key, cur.reps);
      day.exercise.push({ id: uid(), name: def.variants[cur.variantIndex] + ' x' + cur.reps, cals: cals, estimated: true });
      snapshot[key] = { variant: def.variants[cur.variantIndex], reps: cur.reps };
    });
    day.workoutTask = { done: true, feedback: feedback, dayType: dayType, snapshot: snapshot, quote: pickMotivationalQuote() };

    // Advance (or hold) each exercise's target for next time, based on
    // how today's assigned reps felt -- only the exercises actually
    // trained today, not the whole roster.
    keys.forEach(function(key){
      progress[key] = advanceWorkoutStep(progress[key], key, feedback);
    });

    // Move on to the next muscle group for next time. This advances on
    // COMPLETION, not the calendar date, so skipping a day never skips a
    // muscle group -- it just waits.
    var curIdx = WORKOUT_DAY_TYPES.indexOf(dayType);
    settings.workoutDayIndex = (curIdx + 1) % WORKOUT_DAY_TYPES.length;

    workoutFeedbackPending = false;
    await saveLogs();
    await saveSettings();
    render();
  };

  App.logFavorite = async function(type, favId){
    var fav = (favorites[type] || []).find(function(f){ return f.id === favId; });
    if(!fav) return;
    var day = ensureDay(currentDate);
    var entry = { id: uid(), name: fav.name, cals: fav.cals, estimated: !!fav.estimated };
    if(type === 'food'){
      var ng = fav.nutrients || guessNutrientsFromName(fav.name);
      if(ng) entry.nutrients = ng;
    }
    day[type].push(entry);
    await saveLogs();
    render();
  };

  App.deleteFavorite = async function(type, favId){
    favorites[type] = (favorites[type] || []).filter(function(f){ return f.id !== favId; });
    await saveFavorites();
    render();
  };

  App.bumpFavorites = async function(type, delta){
    favorites[type] = (favorites[type] || []).map(function(f){
      return { id: f.id, name: f.name, cals: Math.max(0, f.cals + delta), estimated: f.estimated };
    });
    await saveFavorites();
    render();
  };

  App.addFavorite = async function(type){
    var nameEl = document.getElementById(type + 'FavName');
    var calEl = document.getElementById(type + 'FavCals');
    var btn = document.getElementById(type + 'FavAddBtn');
    var errEl = document.getElementById(type + 'FavErr');
    var name = nameEl.value.trim();
    var calsRaw = calEl.value.trim();
    if(!name) return;
    if(errEl) errEl.textContent = '';

    if(calsRaw !== ''){
      var cals = parseFloat(calsRaw);
      if(isNaN(cals)) return;
      favorites[type].push({ id: uid(), name: name, cals: cals, estimated: false });
      await saveFavorites();
      render();
      return;
    }

    var originalLabel = btn.textContent;
    btn.disabled = true; nameEl.disabled = true; calEl.disabled = true;
    btn.textContent = 'Estimating…';
    try{
      var result = type === 'food'
        ? await estimateFoodCalories(name)
        : await estimateExerciseCalories(name, settings);
      var estCals = Math.round(Number(result.calories));
      if(!isFinite(estCals)) throw new Error('bad estimate');
      var label = (result.label && String(result.label).trim()) || name;
      favorites[type].push({ id: uid(), name: label, cals: estCals, estimated: true });
      await saveFavorites();
      render();
    }catch(e){
      btn.disabled = false; nameEl.disabled = false; calEl.disabled = false; btn.textContent = originalLabel;
      if(errEl) errEl.textContent = "Couldn't estimate that — try entering calories directly.";
    }
  };

  App.logWeight = async function(){
    var el = document.getElementById('weightInput');
    var v = parseFloat(el.value);
    if(isNaN(v)) return;
    var kg = (settings.units || 'imperial') === 'imperial' ? v * 0.453592 : v;
    var day = ensureDay(currentDate);
    day.weight = kg;
    await saveLogs();
    render();
  };

  App.addWater = async function(ml){
    var day = ensureDay(currentDate);
    day.water = Math.max(0, (day.water || 0) + ml);
    await saveLogs();
    render();
  };

  App.addCustomWater = async function(){
    var el = document.getElementById('customWaterInput');
    var v = parseFloat(el.value);
    if(isNaN(v) || v <= 0) return;
    await App.addWater(v);
  };

  App.resetWater = async function(){
    var day = ensureDay(currentDate);
    day.water = 0;
    await saveLogs();
    render();
  };

  function bindDynamicHandlers(){
    ['foodCals','exCals'].forEach(function(id){
      var el = document.getElementById(id);
      if(el){ el.addEventListener('keydown', function(e){
        if(e.key === 'Enter') App.addEntry(id === 'foodCals' ? 'food' : 'exercise');
      }); }
    });
    var wEl = document.getElementById('weightInput');
    if(wEl){ wEl.addEventListener('keydown', function(e){ if(e.key==='Enter') App.logWeight(); }); }
    var cwEl = document.getElementById('customWaterInput');
    if(cwEl){ cwEl.addEventListener('keydown', function(e){ if(e.key==='Enter') App.addCustomWater(); }); }
  }

  // ---------------- profile / PIN auth actions ----------------
  App.authCancel = function(){
    authError = '';
    authPin = [];
    authPendingPlain = null;
    authProfileId = null;
    authMode = null;
    authUsernameDraft = '';
    authView = 'username';
    render();
  };

  App.authSubmitUsername = function(){
    var el = document.getElementById('authUsernameField');
    var name = (el ? el.value : '').trim();
    if(!name){ authError = 'Enter a username.'; render(); return; }
    var dup = profiles.some(function(p){ return p.username.toLowerCase() === name.toLowerCase(); });
    if(dup){ authUsernameDraft = name; authError = 'That name is already taken on this device — pick another.'; render(); return; }
    authUsernameDraft = name;
    authError = '';
    authPin = [];
    authPendingPlain = null;
    authProfileId = null;
    authMode = 'createNew';
    authView = 'pin';
    render();
  };

  App.authSelectProfile = function(id){
    authProfileId = id;
    authMode = 'enter';
    authPin = [];
    authError = '';
    authView = 'pin';
    render();
  };

  App.authForgotPin = function(){
    var pr = profiles.find(function(p){ return p.id === authProfileId; });
    if(!pr) return;
    if(!confirm('Reset the PIN for "'+pr.username+'"? This app has no account server, so anyone with access to this device can do this — it\'s a convenience lock, not real account security. Continue?')) return;
    authMode = 'resetNew';
    authPin = [];
    authPendingPlain = null;
    authError = '';
    render();
  };

  var authSubmitting = false;

  // Updates just the 4 dot indicators in place instead of tearing down and
  // rebuilding the whole gate screen (keypad included) on every digit —
  // that full re-render was the actual source of the "clunky" typing feel.
  // Returns false if the dots aren't on screen (shouldn't normally happen
  // while authView==='pin'), so callers can fall back to a full render.
  function updatePinDotsInPlace(){
    var dotsEl = document.querySelector('.auth-pin-dots');
    if(!dotsEl) return false;
    var dots = dotsEl.querySelectorAll('.auth-pin-dot');
    for(var i=0;i<dots.length;i++){
      if(i < authPin.length) dots[i].classList.add('filled');
      else dots[i].classList.remove('filled');
    }
    if(authError){
      authError = '';
      var errEl = document.querySelector('.auth-error-slot');
      if(errEl) errEl.textContent = '';
    }
    return true;
  }

  App.authKeyPress = function(d){
    if(authSubmitting || authPin.length >= 4) return;
    authPin.push(d);
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }
    if(!updatePinDotsInPlace()) render();
    if(authPin.length === 4){
      authSubmitting = true;
      setTimeout(function(){
        submitAuthPin().then(function(){ authSubmitting = false; }).catch(function(){ authSubmitting = false; });
      }, 130);
    }
  };

  App.authBackspace = function(){
    if(authSubmitting) return;
    authPin.pop();
    if(navigator.vibrate){ try{ navigator.vibrate(6); }catch(e){} }
    if(!updatePinDotsInPlace()) render();
  };

  async function submitAuthPin(){
    var entered = authPin.join('');

    if(authMode === 'enter'){
      var pr = profiles.find(function(p){ return p.id === authProfileId; });
      if(!pr){ authView = 'username'; render(); return; }
      var h = await hashPin(entered, pr.salt);
      if(h === pr.pinHash){
        activeProfileId = pr.id;
        authPin = []; authView = null; authMode = null; authError = '';
        await loadState();
        render();
      } else {
        authError = 'Incorrect PIN.';
        authShake = true;
        authPin = [];
        render();
        setTimeout(function(){ authShake = false; render(); }, 350);
      }
      return;
    }

    if(authMode === 'createNew' || authMode === 'resetNew'){
      authPendingPlain = entered;
      authPin = [];
      authMode = authMode === 'createNew' ? 'createConfirm' : 'resetConfirm';
      authError = '';
      render();
      return;
    }

    if(authMode === 'createConfirm' || authMode === 'resetConfirm'){
      if(entered === authPendingPlain){
        var salt = randomSalt();
        var hash = await hashPin(entered, salt);
        if(authMode === 'createConfirm'){
          var newProfile = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), username: authUsernameDraft, salt: salt, pinHash: hash, createdAt: Date.now() };
          authPendingPlain = null;
          await finishProfileCreation(newProfile);
        } else {
          var pr2 = profiles.find(function(p){ return p.id === authProfileId; });
          if(pr2){ pr2.salt = salt; pr2.pinHash = hash; await saveProfiles(); }
          activeProfileId = authProfileId;
          authPin = []; authView = null; authMode = null; authError = ''; authPendingPlain = null;
          await loadState();
          render();
        }
      } else {
        authError = "PINs didn't match — start over.";
        authShake = true;
        authPin = [];
        authPendingPlain = null;
        authMode = authMode === 'createConfirm' ? 'createNew' : 'resetNew';
        render();
        setTimeout(function(){ authShake = false; render(); }, 350);
      }
    }
  }

  App.deleteProfile = async function(id){
    var p = profiles.find(function(pr){ return pr.id === id; });
    if(!p) return;
    if(!confirm('Delete profile "'+p.username+'"? All of their data will be permanently erased. This cannot be undone.')) return;
    profiles = profiles.filter(function(pr){ return pr.id !== id; });
    await saveProfiles();
    try{ await window.storage.delete('settings:'+id); }catch(e){}
    try{ await window.storage.delete('logs:'+id); }catch(e){}
    try{ await window.storage.delete('favorites:'+id); }catch(e){}
    if(usingLocalFallback){ idbDelete('settings:'+id); idbDelete('logs:'+id); idbDelete('favorites:'+id); }
    render();
  };

  App.switchProfile = function(){
    activeProfileId = null;
    settings = null; logs = {}; favorites = { food: [], exercise: [] };
    settingsOpen = false;
    authView = 'username';
    authMode = null; authPin = []; authError = ''; authProfileId = null; authUsernameDraft = '';
    render();
  };

  document.addEventListener('keydown', function(e){
    if(authView !== 'pin' || e.repeat) return;
    if(e.key >= '0' && e.key <= '9'){ App.authKeyPress(e.key); }
    else if(e.key === 'Backspace'){ App.authBackspace(); }
  });

  window.App = App;

  // ---------------- init ----------------
  (async function init(){
    await loadProfiles();
    if(profiles.length === 0){
      await checkLegacyMigration();
    } else {
      authView = 'username';
    }
    render();
  })();
})();
