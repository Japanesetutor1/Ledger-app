<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Calorie &amp; Training Log</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101418;
    --surface:#171c21;
    --surface-2:#1f2530;
    --surface-3:#262d39;
    --border:#2a313b;
    --border-soft:#20262e;
    --text:#e8ecef;
    --text-dim:#8891a0;
    --text-faint:#565f6b;
    --credit:#5fb88a;
    --credit-dim:#3a5f4c;
    --debit:#c4634f;
    --debit-dim:#5f3e36;
    --gold:#c9a44c;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  .num, .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; }
  #app{ max-width:1040px; margin:0 auto; padding:28px 20px 80px; }
  a, button{ font-family:inherit; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--border);
    padding-bottom:16px; margin-bottom:22px;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;} }
  .wordmark{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px;
    letter-spacing:0.5px; color:var(--text);
  }
  .wordmark span{ color:var(--gold); }
  .tagline{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius); width:32px; height:32px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{ border-color:var(--text-dim); color:var(--text); }

  /* ---------- Date nav ---------- */
  .date-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .date-nav button.nav-arrow{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:30px; height:30px; border-radius:var(--radius); cursor:pointer; font-size:14px;
  }
  .date-nav button.nav-arrow:hover{ border-color:var(--gold); }
  .date-label{
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;
    padding:4px 2px; cursor:pointer; border-bottom:1px dashed var(--text-faint);
  }
  .date-input{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:inherit; border-radius:var(--radius); padding:4px 6px; font-size:13px;
  }
  .today-jump{
    color:var(--gold); font-size:12.5px; cursor:pointer; background:none; border:none;
    padding:0; text-decoration:underline; text-underline-offset:2px;
  }

  /* ---------- Summary ---------- */
  .summary{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; margin-bottom:24px;
  }
  .summary .cell{ background:var(--surface); padding:14px 16px; }
  .summary .cell .label{ color:var(--text-dim); font-size:12px; margin-bottom:6px; }
  .summary .cell .value{ font-size:22px; font-weight:600; }
  .summary .cell .sub{ color:var(--text-faint); font-size:11px; margin-top:4px; }
  .value.credit{ color:var(--credit); }
  .value.debit{ color:var(--debit); }
  @media(max-width:640px){ .summary{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Panels ---------- */
  .panels{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  @media(max-width:760px){ .panels{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{ font-size:13px; margin:0; font-weight:600; }
  .panel-head h2.credit-text{ color:var(--credit); }
  .panel-head h2.debit-text{ color:var(--debit); }
  .panel-head .total{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-dim); }
  .entry-list{ list-style:none; margin:0; padding:0; max-height:260px; overflow-y:auto; }
  .entry-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px;
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-name{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:10px; }
  .entry-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .entry-cals{ font-family:'IBM Plex Mono',monospace; color:var(--text-dim); }
  .del-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px;
    line-height:1; padding:2px 4px;
  }
  .del-btn:hover{ color:var(--debit); }
  .empty-state{ padding:20px 14px; color:var(--text-faint); font-size:13px; }
  .add-row{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); }
  .add-row input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:7px 9px; font-family:inherit; font-size:13px;
  }
  .add-row input.name-input{ flex:1; min-width:0; }
  .add-row input.cal-input{ width:80px; font-family:'IBM Plex Mono',monospace; }
  .add-row button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:0 14px; cursor:pointer; font-size:13px; font-weight:500;
  }
  .add-row button:hover{ border-color:var(--gold); color:var(--gold); }
  .add-row button:disabled{ opacity:.6; cursor:default; }
  .add-row input:disabled{ opacity:.6; }
  .add-row-err{ color:var(--debit); font-size:11.5px; padding:0 14px 10px; margin-top:-4px; }
  .estimated-mark{ color:var(--gold); }

  .favorites-wrap{ border-bottom:1px solid var(--border); }

  .fooddb{ border-bottom:1px solid var(--border); padding:12px 14px; }
  .fooddb input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:8px 10px; font-family:inherit; font-size:13px; margin-bottom:8px;
  }
  .fooddb-results{ max-height:220px; overflow-y:auto; }
  .fooddb-hint{ color:var(--text-faint); font-size:12px; padding:2px 2px 4px; }
  .fooddb-row{
    display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .fooddb-row:last-child{ border-bottom:none; }
  .fooddb-name{ flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fooddb-unit{ color:var(--text-faint); font-size:11px; }
  .fooddb-cals{ color:var(--text-dim); flex-shrink:0; }
  .fooddb-row button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:3px 9px; font-size:11.5px; cursor:pointer; flex-shrink:0;
  }
  .fooddb-row button:hover{ border-color:var(--gold); color:var(--gold); }
  .fooddb-row button.fooddb-fav{ padding:3px 7px; font-size:13px; }
  .favorites-row{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 4px; }
  .favorites-empty{ padding:12px 14px 4px; color:var(--text-faint); font-size:12px; }
  .favorite-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:5px 8px 5px 12px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:7px;
    max-width:100%;
  }
  .favorite-chip:hover{ border-color:var(--gold); }
  .favorite-chip .fav-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .favorite-chip .fav-cals{ color:var(--text-dim); flex-shrink:0; }
  .favorite-chip .fx-del{ color:var(--text-faint); cursor:pointer; padding:0 2px; flex-shrink:0; }
  .favorite-chip .fx-del:hover{ color:var(--debit); }
  .fav-tools{ display:flex; align-items:center; gap:8px; padding:10px 14px 0; font-size:11px; color:var(--text-faint); }
  .fav-tools button{
    background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:12px;
    padding:2px 9px; font-size:11px; cursor:pointer;
  }
  .fav-tools button:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- Weight strip ---------- */
  .weight-strip{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:24px;
    font-size:13px;
  }
  .weight-strip label{ color:var(--text-dim); }
  .weight-strip input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 8px; width:90px; font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .weight-strip button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 12px; cursor:pointer; font-size:12.5px;
  }
  .weight-strip button:hover{ border-color:var(--gold); color:var(--gold); }
  .weight-strip .logged{ color:var(--text-faint); font-size:12px; }

  /* ---------- Hydration ---------- */
  .hydration{
    display:flex; gap:18px; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:24px;
  }
  .hydration-flask{ flex:0 0 auto; width:64px; height:91px; }
  .hydration-flask svg{ width:100%; height:100%; display:block; }
  .hydration-main{ flex:1; min-width:0; }
  .hydration-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .hydration-head h2{ font-size:13px; margin:0; font-weight:600; color:var(--text); }
  .hydration-pct{ font-size:14px; font-weight:600; }
  .hydration-amounts{ font-size:15px; color:var(--text); margin-bottom:3px; }
  .hydration-sub{ color:var(--text-faint); font-size:11px; margin-bottom:10px; }
  .hydration-buttons{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .hydration-buttons button{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 12px; cursor:pointer; font-size:12px;
  }
  .hydration-buttons button:hover{ border-color:#5fa8d3; color:#5fa8d3; }
  .hydration-buttons input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 8px; width:88px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .hydration-buttons .hydration-reset{ color:var(--text-faint); border-color:var(--border); margin-left:auto; }
  .hydration-buttons .hydration-reset:hover{ color:var(--debit); border-color:var(--debit); }
  @media(max-width:520px){ .hydration{ flex-direction:column; align-items:flex-start; } .hydration-flask{ align-self:center; } }

  /* ---------- Trend ---------- */
  .trend{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:24px; }
  .trend-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .trend-head h2{ font-size:13px; margin:0; font-weight:600; }
  .trend-head .window-toggle{ display:flex; gap:6px; }
  .window-toggle button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius); padding:3px 9px; font-size:11.5px; cursor:pointer;
  }
  .window-toggle button.active{ border-color:var(--gold); color:var(--gold); }
  .chart-wrap{ margin:10px 0 16px; }
  .trend-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  @media(max-width:640px){ .trend-stats{ grid-template-columns:1fr; } }
  .trend-stats .cell{ background:var(--surface-2); padding:12px 14px; }
  .trend-stats .label{ color:var(--text-dim); font-size:11.5px; margin-bottom:5px; }
  .trend-stats .value{ font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; }
  .trend-empty{ color:var(--text-faint); font-size:13px; padding:6px 2px; }

  /* ---------- Settings ---------- */
  .settings-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:24px; display:none;
  }
  .settings-panel.open{ display:block; }
  .settings-panel h2{ font-size:13px; margin:0 0 14px; font-weight:600; color:var(--gold); }
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
  @media(max-width:600px){ .settings-grid{ grid-template-columns:1fr; } }
  .field label{ display:block; color:var(--text-dim); font-size:11.5px; margin-bottom:5px; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:7px 9px; font-family:inherit; font-size:13px;
  }
  .field.split{ display:flex; gap:8px; }
  .field.split > div{ flex:1; }
  .seg{ display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .seg button{
    flex:1; background:var(--surface-2); border:none; color:var(--text-dim); padding:7px 0;
    cursor:pointer; font-size:12.5px; border-right:1px solid var(--border);
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--surface-3); color:var(--gold); }
  .settings-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  .backup-section{ margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  .backup-section h2{ font-size:13px; margin:0 0 8px; font-weight:600; color:var(--gold); }
  .backup-buttons{ display:flex; gap:10px; margin-top:10px; }
  .backup-buttons button, .backup-buttons .import-btn{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:7px 14px; cursor:pointer; font-size:12.5px; font-family:inherit;
    display:inline-flex; align-items:center;
  }
  .backup-buttons button:hover, .backup-buttons .import-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .import-btn input[type="file"]{ display:none; }
  .save-btn{
    background:var(--gold); border:none; color:#191410; font-weight:600;
    border-radius:var(--radius); padding:8px 18px; cursor:pointer; font-size:13px;
  }
  .save-btn:hover{ opacity:.9; }
  .reset-link{ background:none; border:none; color:var(--text-faint); font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .reset-link:hover{ color:var(--debit); }
  .baseline-note{ color:var(--text-faint); font-size:11.5px; margin-top:10px; line-height:1.5; }

  .setup-banner{
    background:var(--surface); border:1px solid var(--gold); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:20px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .setup-banner button{ background:var(--gold); border:none; color:#191410; font-weight:600; border-radius:var(--radius); padding:7px 14px; cursor:pointer; font-size:12.5px; }
  .backup-reminder{ border-color:#5fa8d3; }
  .backup-reminder-actions{ display:flex; gap:8px; flex-shrink:0; }
  .backup-reminder-actions button:first-child{ background:#5fa8d3; color:#0d1720; }
  .backup-reminder-actions .reminder-dismiss{ background:none; border:1px solid var(--border); color:var(--text-dim); }
  .backup-reminder-actions .reminder-dismiss:hover{ color:var(--text); border-color:var(--text-dim); }

  .loading{ color:var(--text-dim); padding:40px 0; text-align:center; font-family:'IBM Plex Mono',monospace; }

  /* ---------- Status panel (mascot / level / quests) ---------- */
  .status-panel{
    background:linear-gradient(160deg,#12161c,#0d1014);
    border:1px solid var(--status-color,var(--gold));
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px -6px var(--status-color,var(--gold));
    border-radius:var(--radius); padding:18px 18px 6px; margin-bottom:22px;
    transition:box-shadow .4s ease, border-color .4s ease;
  }
  .status-top{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .status-mascot-wrap{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .status-mascot{
    width:130px; height:143px; padding:0; margin:0; border:none; background:none;
    cursor:pointer; border-radius:var(--radius); transition:transform .15s ease;
  }
  .status-mascot:hover{ transform:scale(1.04); }
  .status-mascot:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .status-mascot svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .status-mascot-hint{ font-size:10px; color:var(--text-faint); }
  .mascot-figure{ transform-box:view-box; transform-origin:center; animation:mascotBob 4.4s ease-in-out infinite; }
  .mascot-eye{ transform-box:fill-box; transform-origin:center; animation:mascotBlink 6s ease-in-out infinite; }
  .mascot-sparkle{ transform-box:fill-box; transform-origin:center; animation:mascotTwinkle 2.4s ease-in-out infinite; }
  .mascot-orb{ transform-box:fill-box; transform-origin:center; animation:mascotOrbPulse 2.6s ease-in-out infinite; }
  .mascot-aura{ transform-box:fill-box; transform-origin:center; animation:mascotAuraSpin 24s linear infinite; }
  @keyframes mascotBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
  @keyframes mascotBlink{ 0%,90%,100%{ transform:scaleY(1); } 93%{ transform:scaleY(0.1); } 96%{ transform:scaleY(1); } }
  @keyframes mascotTwinkle{ 0%,100%{ opacity:0.3; transform:scale(0.7); } 50%{ opacity:0.9; transform:scale(1.1); } }
  @keyframes mascotOrbPulse{ 0%,100%{ opacity:0.85; transform:scale(1); } 50%{ opacity:1; transform:scale(1.2); } }
  @keyframes mascotAuraSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .mascot-figure, .mascot-eye, .mascot-sparkle, .mascot-orb, .mascot-aura{ animation:none; }
  }

  /* Level-up: a bright pulse on the whole status panel, plays once per DOM
     insertion (added only on the render where the level actually went up). */
  .status-panel.level-up-flash{ animation:levelUpFlash 1.4s ease-out; }
  @keyframes levelUpFlash{
    0%{ box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px -6px var(--status-color,var(--gold)); }
    30%{ box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 48px 4px var(--status-color,var(--gold)); transform:scale(1.012); }
    100%{ box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px -6px var(--status-color,var(--gold)); transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .status-panel.level-up-flash{ animation:none; }
  }

  /* ---------- Avatar picker (class + color scheme) ---------- */
  .avatar-picker-backdrop{
    position:fixed; inset:0; background:rgba(6,8,10,.72); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .avatar-picker{
    background:linear-gradient(160deg,#12161c,#0d1014); border:1px solid var(--gold);
    border-radius:var(--radius); padding:20px; max-width:460px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px -8px rgba(0,0,0,.6);
  }
  .avatar-picker-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .avatar-picker-head h2{ font-size:14px; margin:0; color:var(--gold); }
  .avatar-picker-close{ background:none; border:none; color:var(--text-dim); font-size:20px; line-height:1; cursor:pointer; padding:2px 6px; }
  .avatar-picker-close:hover{ color:var(--gold); }
  .avatar-picker-preview{ width:140px; height:154px; margin:0 auto 14px; }
  .avatar-picker-preview svg{ width:100%; height:100%; display:block; }
  .avatar-class-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  @media(max-width:420px){ .avatar-class-grid{ grid-template-columns:repeat(2,1fr); } }
  .avatar-class-tile{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 6px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;

  .stat-bar-row{ display:grid; grid-template-columns:78px 1fr 30px; align-items:center; gap:8px; }

  .stat-bar-inner{ height:100%; border-radius:3px; }

(function(){
  // Outside the Claude artifact environment window.storage doesn't exist —
  // fall back to localStorage so the app works standalone on a phone.
  var usingLocalFallback = !window.storage;
  if(usingLocalFallback){
    window.storage = {
      get: async function(key){
        try{
          var v = localStorage.getItem(key);
          if(v === null) return null;
          return { key: key, value: v, shared: false };
        }catch(e){ return null; }
      },
      set: async function(key, value){
        try{
          localStorage.setItem(key, value);
          return { key: key, value: value, shared: false };
        }catch(e){ return null; }
      },
      delete: async function(key){
        try{
          localStorage.removeItem(key);
          return { key: key, deleted: true, shared: false };
        }catch(e){ return null; }
      },
      list: async function(prefix){
        try{
          var keys = [];
          for(var i=0;i<localStorage.length;i++){
            var k = localStorage.key(i);
            if(!prefix || k.indexOf(prefix) === 0) keys.push(k);
          }
          return { keys: keys, prefix: prefix, shared: false };
        }catch(e){ return null; }
      }
    };
    // Ask the browser not to evict this site's storage under pressure.
    // Real mitigation for iOS Safari's well-documented localStorage-eviction
    // issue on installed home-screen apps — not a full guarantee, but a
    // legitimate, harmless request supported by most browsers.
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(function(){});
    }
  }

  // Second, independent storage backend (IndexedDB) mirrored alongside
  // localStorage whenever running standalone. Two unrelated storage systems
  // are very unlikely to both get evicted at once, and this needs zero
  // action from the user — it's the "auto backup" safety belt. Every write
  // goes to both; on load, whichever side actually has data wins, and the
  // other side gets silently repaired from it.
  function idbOpen(){
    return new Promise(function(resolve, reject){
      if(!('indexedDB' in window)) return reject(new Error('no indexedDB'));
      var req = indexedDB.open('ledger-backup', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbSet(key, value){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        try{
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(value, key);
          tx.oncomplete = function(){ resolve(true); };
          tx.onerror = function(){ resolve(false); };
        }catch(e){ resolve(false); }
      });
    }).catch(function(){ return false; });
  }
  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        try{
          var tx = db.transaction('kv', 'readonly');
          var req = tx.objectStore('kv').get(key);
          req.onsuccess = function(){ resolve(req.result != null ? req.result : null); };
          req.onerror = function(){ resolve(null); };
        }catch(e){ resolve(null); }
      });
    }).catch(function(){ return null; });

  function ensureDay(dateStr){
    if(!logs[dateStr]) logs[dateStr] = { food: [], exercise: [], weight: null, water: 0 };
    if(!logs[dateStr].food) logs[dateStr].food = [];

  // ---------------- calc ----------------
  function hasBaselineInputs(s){
    return s && s.sex && s.age && s.heightCm && s.weightKg;
  }
  function computeBMR(s){
    if(!hasBaselineInputs(s)) return null;
    var base = 10*s.weightKg + 6.25*s.heightCm - 5*s.age;
    return s.sex === 'male' ? base + 5 : base - 161;
  }
  function computeBaseline(s){
    var bmr = computeBMR(s);
    if(bmr == null) return null;
    if(s.baselineMode === 'tdee'){
      return bmr * (s.activityMultiplier || 1.2);
    }
    return bmr;
  }
  // Daily water target. When full baseline stats are set, uses the standard
  // clinical rule of thumb of ~1 ml of water per kcal of total energy expenditure
  // (so it reflects age, weight, height and sex the same way the BMR calc does,
  // scaled by activity level). Falls back to a plain 33 ml/kg estimate if only
  // weight is known, and to a flat population-average default otherwise.
  function computeWaterGoalMl(s){
    var bmr = computeBMR(s);
    if(bmr != null){
      var tdee = bmr * (s.activityMultiplier || 1.375);
      return Math.round(tdee);
    }
    if(s && s.weightKg){
      return Math.round(s.weightKg * 33);
    }
    return 2200;
  }
  function dayTotals(dateStr){
    var day = logs[dateStr] || { food:[], exercise:[], weight:null };
    var intake = (day.food||[]).reduce(function(a,f){ return a+f.cals; }, 0);
    var exBurn = (day.exercise||[]).reduce(function(a,e){ return a+e.cals; }, 0);
    var baseline = computeBaseline(settings);
    var totalBurn = (baseline||0) + exBurn;
    var balance = totalBurn - intake; // positive = deficit (burned more than eaten)
    return { intake:intake, exBurn:exBurn, baseline:baseline, totalBurn:totalBurn, balance:balance, hasBaseline: baseline != null, tracked: (day.food.length>0 || day.exercise.length>0) };
  }
  function trackedDatesSorted(){
    return Object.keys(logs).filter(function(d){
      var day = logs[d];
      return day && ((day.food && day.food.length) || (day.exercise && day.exercise.length) || day.weight != null);
    }).sort();
  }

  function shouldShowBackupReminder(){
    if(!usingLocalFallback) return false; // no need inside the Claude artifact — that storage is already durable
    if(reminderDismissed) return false;
    if(trackedDatesSorted().length === 0) return false; // nothing worth backing up yet
    var last = settings.lastExportAt;
    if(!last) return true;
    var daysSince = (Date.now() - last) / 86400000;
    return daysSince >= 3;
  }
  function backupReminderText(){
    if(!settings.lastExportAt) return "You haven't exported a backup yet — a quick safety net against your phone clearing local data.";
    var days = Math.floor((Date.now() - settings.lastExportAt) / 86400000);
    return "It's been " + days + " days since your last backup export.";
  }

  function lastNTrackedDates(n){
    var dates = trackedDatesSorted();
    var upTo = dates.filter(function(d){ return d <= currentDate; });

  }
  function avgBalance(n){
    var dates = lastNTrackedDates(n).filter(function(d){ return dayTotals(d).tracked; });
    if(!dates.length) return null;
    var sum = dates.reduce(function(a,d){ return a + dayTotals(d).balance; }, 0);
    return sum / dates.length;
  }
  function cumulativeBalance(){
    var dates = trackedDatesSorted().filter(function(d){ return d <= currentDate && dayTotals(d).tracked; });
    return dates.reduce(function(a,d){ return a + dayTotals(d).balance; }, 0);
  }

  // ---------------- AI estimation ----------------
  async function callClaudeAPI(systemPrompt, userPrompt, opts){
    opts = opts || {};
    var body = {
      model: 'claude-sonnet-4-6',
      max_tokens: opts.maxTokens || 300,
      system: systemPrompt,
      messages: [{ role: 'user', content: userPrompt }]
    };
    if(opts.tools) body.tools = opts.tools;
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('request failed');
    var data = await res.json();
    // With web_search enabled, content can include search/tool-use blocks
    // before the final answer — take the LAST text block, not the first.
    var textBlocks = (data.content || []).filter(function(b){ return b.type === 'text'; });
    if(!textBlocks.length) throw new Error('no text in response');
    var lastText = textBlocks[textBlocks.length - 1].text;
    var clean = lastText.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  function physiqueState(){
    var dates = trackedDatesSorted().filter(function(d){ return d <= currentDate && dayTotals(d).tracked; });

    var avg = avgBalance(n);

    var credit = [95,184,138], gold = [201,164,76], debit = [196,99,79];

  // Continuous body-size multiplier from BMI (~0.85 lean .. 1.35 heavy), neutral
  // (1.0) when there isn't enough data yet to compute one.
  function bodyBulkFactor(){
    var wKg = latestLoggedWeightKg();
    var hCm = settings.heightCm;
    if(!wKg || !hCm) return 1;
    var bmi = wKg / Math.pow(hCm/100, 2);
    var t = clamp((bmi - 18.5) / (32 - 18.5), 0, 1);
    return lerp(0.85, 1.35, t);

  function mascotSVG(score, bulk, classId, schemeIdx){
    var cdef = AVATAR_CLASSES[classId] || AVATAR_CLASSES.mage;
    if(!classId || !AVATAR_CLASSES[classId]) classId = 'mage';
    var pal = cdef.schemes[schemeIdx] || cdef.schemes[0];
    var uid = 'm' + classId + (schemeIdx||0) + '_' + Math.round(((score||0)+3)*100);

    var color = physiqueColor(score);
    // Power tier: same 5 thresholds as physiqueLabel, but every knob here is
    // about how a leveling-up hunter would look at that rank rather than a
    // body-shape slider — bend (hunch), cape flare, aura strength, and a
    // determined-vs-tired brow angle.
    var band;
    if(score <= -2.2)      band = { tier:'Sovereign', bend:0,   cape:1.35, aura:1.0,  power:1.15, particles:4, browAngle:6 };
    else if(score <= -0.8) band = { tier:'Ascendant', bend:1.2, cape:1.05, aura:0.75, power:1.08, particles:3, browAngle:4 };
    else if(score < 0.8)   band = { tier:'Awakened',  bend:2.2, cape:0.85, aura:0.55, power:1.0,  particles:2, browAngle:2 };
    else if(score < 2.2)   band = { tier:'Novice',    bend:4,   cape:0.5,  aura:0.28, power:0.92, particles:1, browAngle:0 };
    else                    band = { tier:'Dormant',   bend:6.5, cape:0.28, aura:0.1,  power:0.85, particles:0, browAngle:-3 };

    // Body size: short-term calorie-trend "power" combined with the user's
    // actual weight-for-height (bulk) and a per-class base build.
    var bulkEff = clamp((bulk||1) * (cdef.bulkBase||1), 0.75, 1.45);
    var squatEff = clamp(band.power * bulkEff, 0.7, 1.7);
    var stanceEff = clamp(band.power * (1 + (bulkEff-1)*0.7), 0.7, 1.7);
    var bw = (squatEff-1)*11;
    var lx = (stanceEff-1)*10;

    var SKIN=pal.skin, HAIR=pal.trim, HAIR_HI=pal.trimHi, JACKET=pal.body, JACKET_DARK=pal.bodyDark, SHOE='#0a0c0f';

    var cx = 100;
    var headR = 19, headCy = 38;

  // A day's quest checklist, evaluated against that day's actual data.
  function questsForDay(dateStr){
    var t = dayTotals(dateStr);
    var day = logs[dateStr] || { food:[], exercise:[], weight:null };
    var goal = settings.goal || 'maintain';
    var goalQuest;
    if(goal === 'lose'){
      goalQuest = { name:'Finish the day in a deficit', done: t.tracked && t.balance > 0, xp: 25 };
    } else if(goal === 'gain'){
      goalQuest = { name:'Finish the day in a surplus', done: t.tracked && t.balance < 0, xp: 25 };
    } else {
      goalQuest = { name:'Stay within 200 kcal of even', done: t.tracked && Math.abs(t.balance) <= 200, xp: 25 };
    }
    return [
      { name:'Log at least two meals', done: (day.food||[]).length >= 2, xp: 10 },
      { name:'Get a workout in', done: (day.exercise||[]).length >= 1, xp: 15 },
      goalQuest,
      { name:'Log today\'s weight', done: day.weight != null, xp: 10 }
    ];
  }

  function xpForDay(dateStr){
    return questsForDay(dateStr).reduce(function(sum,q){ return sum + (q.done ? q.xp : 0); }, 0);
  }

  function totalXP(){
    return Object.keys(logs).reduce(function(sum, d){
      if(!dayTotals(d).tracked) return sum;
      return sum + xpForDay(d);
    }, 0);
  }

  function levelInfo(){
    var xp = totalXP();
    var level = 1 + Math.floor(Math.sqrt(xp / 40));
    var xpForLevel = function(l){ return Math.pow(l-1, 2) * 40; };
    var curFloor = xpForLevel(level);
    var nextFloor = xpForLevel(level+1);
    var progress = nextFloor > curFloor ? (xp - curFloor) / (nextFloor - curFloor) : 1;
    var titles = [
      [1,'Novice'], [3,'Adept'], [6,'Vanguard'], [10,'Elite'], [15,'Ascendant']
    ];
    var title = titles[0][1];
    titles.forEach(function(t){ if(level >= t[0]) title = t[1]; });
    return { xp:xp, level:level, curFloor:curFloor, nextFloor:nextFloor, progress:clamp(progress,0,1), title:title };
  }

  function currentStreak(){
    var d = todayStr();
    var streak = 0;
    while(dayTotals(d).tracked){
      streak++;
      d = addDays(d, -1);
    }
    return streak;
  }

  function statBars(){
    var last14 = lastNDates(14);
    var trackedCount = last14.filter(function(d){ return dayTotals(d).tracked; }).length;
    var consistency = Math.round((trackedCount / 14) * 100);

    var last7 = lastNDates(7);
    var exerciseSum = last7.reduce(function(sum,d){ return sum + dayTotals(d).exBurn; }, 0);
    var power = Math.round(clamp(exerciseSum / 3000, 0, 1) * 100);

    var trackedLast14 = last14.filter(function(d){ return dayTotals(d).tracked; });
    var metGoal = trackedLast14.filter(function(d){
      var qs = questsForDay(d);
      return qs[2].done;
    }).length;
    var control = trackedLast14.length ? Math.round((metGoal / trackedLast14.length) * 100) : 0;

    return [
      { label:'Consistency', value:consistency, color:'var(--gold)' },
      { label:'Power', value:power, color:'var(--gold)' },
      { label:'Control', value:control, color:'var(--gold)' }
    ];
  }

  function lastNDates(n){
    var out = [];
    var d = todayStr();
    for(var i=0;i<n;i++){ out.unshift(d); d = addDays(d,-1); }
    return out;
  }

  function flaskSVG(pct, accent){
    pct = clamp(pct, 0, 1);
    var neckTop = 8, neckBot = 42, bulbBot = 150;
    var liquidTop = bulbBot - (bulbBot - 22) * pct;
    var flaskPath = 'M48,'+neckTop+' L72,'+neckTop+' L72,'+neckBot+' C95,'+(neckBot+10)+' 105,90 100,120 C97,140 85,150 60,150 C35,150 23,140 20,120 C15,90 25,'+(neckBot+10)+' 48,'+neckBot+' Z';
    var liquidGroup = '';
    if(pct > 0.015){
      var wave = 'M20,'+liquidTop.toFixed(1)+' C 35,'+(liquidTop-4).toFixed(1)+' 45,'+(liquidTop+4).toFixed(1)+' 60,'+liquidTop.toFixed(1)+' C 75,'+(liquidTop-4).toFixed(1)+' 85,'+(liquidTop+4).toFixed(1)+' 100,'+liquidTop.toFixed(1)+' L100,160 L20,160 Z';
      liquidGroup = '<g clip-path="url(#flaskClip)">' +
        '<path d="'+wave+'" fill="'+accent+'" opacity="0.85"/>' +
        '<circle cx="45" cy="'+(liquidTop+25).toFixed(1)+'" r="2.5" fill="#ffffff" opacity="0.4"/>' +
        '<circle cx="68" cy="'+(liquidTop+40).toFixed(1)+'" r="1.8" fill="#ffffff" opacity="0.3"/>' +
      '</g>';
    }
    return (
      '<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><clipPath id="flaskClip"><path d="'+flaskPath+'"/></clipPath></defs>' +
        liquidGroup +
        '<path d="'+flaskPath+'" fill="none" stroke="#5a6b85" stroke-width="2.5"/>' +
      '</svg>'
    );
  }

    return (
      '<div class="hydration">' +
        '<div class="hydration-flask">' + flaskSVG(pct, accent) + '</div>' +
        '<div class="hydration-main">' +
          '<div class="hydration-head">' +
            '<h2>Hydration</h2>' +
            '<span class="hydration-pct num" style="color:' + (metGoal ? 'var(--credit)' : accent) + '">' + Math.round(pct*100) + '%</span>' +
          '</div>' +
          '<div class="hydration-amounts num">' + round(have) + ' / ' + round(goal) + ' ml' + (metGoal ? ' — goal hit' : '') + '</div>' +
          '<div class="hydration-sub">goal estimated from your age, weight, height ' + (hasBaselineInputs(settings) ? '&amp; activity level' : '(add full stats in settings to refine)') + '</div>' +

  function foodDbMatches(query){
    if(!query) return [];
    var q = query.toLowerCase();
    return FOOD_DB.filter(function(it){
      return it.name.toLowerCase().indexOf(q) >= 0 || it.category.toLowerCase().indexOf(q) >= 0;
    }).slice(0, 8);
  }

        (items.length
          ? '<div class="favorites-row">' + chips + '</div>'
          : '<div class="favorites-empty">No common ' + noun + ' saved yet — add one below.</div>') +
        '<div class="add-row">' +
          '<input class="name-input" id="' + type + 'FavName" placeholder="Save a new common ' + (type==='food'?'food':'exercise') + '" maxlength="120">' +
          '<input class="cal-input num" id="' + type + 'FavCals" type="number" min="0" placeholder="kcal (auto)">' +
          '<button id="' + type + 'FavAddBtn" onclick="App.addFavorite(\'' + type + '\')">Save</button>' +
        '</div>' +
        '<div class="add-row-err" id="' + type + 'FavErr"></div>' +
      '</div>'
    );
  }

  function ensureDayReadOnly(dateStr){
    return logs[dateStr] || { food:[], exercise:[], weight:null };
  }

  function renderEntryList(items, type){
    if(!items.length){
      var msg = type === 'food' ? 'No food logged yet — add your first item above.' : 'No exercise logged yet — add a workout above.';
      return '<div class="empty-state">' + msg + '</div>';
    }
    var html = '<ul class="entry-list">';
    items.forEach(function(it){
      html += '<li class="entry-row"><span class="entry-name">' + esc(it.name) + '</span>' +
        '<span class="entry-right"><span class="entry-cals num">' + (it.estimated ? '<span class="estimated-mark">~</span>' : '') + round(it.cals) + '</span>' +
        '<button class="del-btn" onclick="App.deleteEntry(\'' + type + '\',\'' + it.id + '\')">&times;</button></span></li>';
    });
    html += '</ul>';
    return html;
  }

  function renderTrend(){
    var dates7 = lastNTrackedDates(7).filter(function(d){return dayTotals(d).tracked;});
    var dates30 = lastNTrackedDates(30).filter(function(d){return dayTotals(d).tracked;});
    var chartDates = lastNTrackedDates(14).filter(function(d){return dayTotals(d).tracked;});

    if(!chartDates.length){
      return (
        '<div class="trend">' +
          '<div class="trend-head"><h2>Trend &amp; projection</h2></div>' +
          '<div class="trend-empty">Log a few days of food and exercise to see your trend and projection.</div>' +
        '</div>'
      );
    }

    var avg7 = avgBalance(7);
    var avg30 = avgBalance(30);
    var activeAvg = trendWindow === 7 ? avg7 : avg30;
    var weeklyRateKcal = activeAvg != null ? activeAvg * 7 : null;
    var weeklyRateUnit = weeklyRateKcal != null ? kcalToWeightUnit(weeklyRateKcal) : null;

    var etaText = 'Set a goal weight and current weight in settings to see an ETA.';
    if(settings.goalWeightKg && settings.weightKg && activeAvg != null && Math.abs(activeAvg) > 1){
      var deltaKcal = (settings.weightKg - settings.goalWeightKg) / KG_PER_KCAL; // kcal needed as deficit(+) to reach goal
      var neededDirectionMatches = (deltaKcal > 0 && activeAvg > 0) || (deltaKcal < 0 && activeAvg < 0);
      if(neededDirectionMatches){
        var daysNeeded = Math.abs(deltaKcal / activeAvg);
        var etaDate = new Date(Date.now() + daysNeeded*86400000);
        etaText = 'At this rate, goal weight around ' + etaDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' (~' + Math.ceil(daysNeeded) + ' days).';
      } else {
        etaText = 'Current average balance is trending away from your goal weight, not toward it.';
      }
    }

    return (
      '<div class="trend">' +
        '<div class="trend-head">' +
          '<h2>Trend &amp; projection</h2>' +
          '<div class="window-toggle">' +
            '<button class="' + (trendWindow===7?'active':'') + '" onclick="App.setWindow(7)">7-day avg</button>' +
            '<button class="' + (trendWindow===30?'active':'') + '" onclick="App.setWindow(30)">30-day avg</button>' +
          '</div>' +
        '</div>' +
        '<div class="chart-wrap">' + renderChart(chartDates) + '</div>' +
        '<div class="trend-stats">' +
          '<div class="cell"><div class="label">Avg daily balance (' + trendWindow + 'd)</div><div class="value ' + (activeAvg>=0?'credit':'debit') + '">' + (activeAvg!=null?(sign(activeAvg)+Math.abs(round(activeAvg))):'—') + '</div></div>' +
          '<div class="cell"><div class="label">Projected weekly change</div><div class="value">' + (weeklyRateUnit!=null ? (sign(weeklyRateUnit)+Math.abs(Math.round(weeklyRateUnit*100)/100)+' '+unitLabel()) : '—') + '</div></div>' +
          '<div class="cell"><div class="label">Goal ETA</div><div class="value" style="font-size:12.5px;font-weight:400;line-height:1.5;">' + etaText + '</div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderChart(dates){
    var W = 640, H = 160, padL = 30, padR = 10, padTop = 10, padBot = 20;
    var innerW = W - padL - padR;
    var zeroY = padTop + (H - padTop - padBot) / 2;
    var vals = dates.map(function(d){ return dayTotals(d).balance; });
    var maxAbs = Math.max.apply(null, vals.map(Math.abs).concat([200]));
    var scale = ((H - padTop - padBot)/2) / (maxAbs * 1.15);
    var barW = Math.min(28, innerW / dates.length * 0.6);
    var gap = innerW / dates.length;

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;overflow:visible;">';
    svg += '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W-padR) + '" y2="' + zeroY + '" stroke="var(--border)" stroke-width="1"/>';
    dates.forEach(function(d, i){
      var v = dayTotals(d).balance;
      var x = padL + gap*i + (gap-barW)/2;
      var h = Math.abs(v) * scale;
      var y = v >= 0 ? zeroY - h : zeroY;
      var color = v >= 0 ? 'var(--credit)' : 'var(--debit)';
      svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h,1) + '" fill="' + color + '" rx="1"/>';
      var dd = new Date(d+'T00:00:00Z');
      var lbl = dd.toLocaleDateString(undefined,{day:'numeric',timeZone:'UTC'});
      svg += '<text x="' + (x+barW/2) + '" y="' + (H-4) + '" text-anchor="middle" font-size="9" fill="var(--text-faint)" font-family="IBM Plex Mono, monospace">' + lbl + '</text>';
    });
    svg += '</svg>';
    return svg;
  }

  // ---------------- interactions ----------------
  var App = {};

  App.shiftDate = function(n){
    currentDate = addDays(currentDate, n);
    render();
  };
  App.toggleDatePicker = function(){
    var el = document.getElementById('datePicker');
    var lbl = document.getElementById('dateLabel');
    if(el.style.display === 'none'){ el.style.display='inline-block'; lbl.style.display='none'; el.focus(); }
  };
  App.jumpDate = function(v){
    if(v){ currentDate = v; render(); }
  };
  App.toggleSettings = function(){
    settingsOpen = !settingsOpen;
    render();
  };
  App.openSettings = function(){
    settingsOpen = true;
    render();
  };
  App.setUnits = function(u){
    settings.units = u;
    render();
  };
  App.setField = function(k,v){
    settings[k] = v;
    render();
  };
  App.setWindow = function(n){
    trendWindow = n;
    render();
  };

  App.toggleAvatarPicker = function(){
    avatarPickerOpen = !avatarPickerOpen;
    render();
  };
  App.closeAvatarPicker = function(){
    avatarPickerOpen = false;
    render();
  };
  App.setAvatarClass = async function(cls){
    if(!AVATAR_CLASSES[cls]) return;
    settings.avatarClass = cls;
    if(typeof settings.avatarScheme !== 'number') settings.avatarScheme = 0;
    await saveSettings();
    render();
  };
  App.setAvatarScheme = async function(idx){
    settings.avatarScheme = idx;
    await saveSettings();
    render();
  };

  App.saveSettingsFromForm = async function(){
    var units = settings.units || 'imperial';
    var age = parseFloat(document.getElementById('f_age').value);
    var sex = settings.sex;
    var weightKg, heightCm, goalWeightKg;

    if(units === 'imperial'){
      var wLb = parseFloat(document.getElementById('f_weight').value);
      var ft = parseFloat(document.getElementById('f_heightFt').value) || 0;
      var inch = parseFloat(document.getElementById('f_heightIn').value) || 0;
      var gwLb = parseFloat(document.getElementById('f_goalWeight').value);
      weightKg = isNaN(wLb) ? null : wLb * 0.453592;
      heightCm = (ft || inch) ? (ft*12+inch)*2.54 : null;
      goalWeightKg = isNaN(gwLb) ? null : gwLb * 0.453592;
    } else {
      var wKg = parseFloat(document.getElementById('f_weight').value);
      var hCm = parseFloat(document.getElementById('f_heightCm').value);
      var gwKg = parseFloat(document.getElementById('f_goalWeight').value);
      weightKg = isNaN(wKg) ? null : wKg;
      heightCm = isNaN(hCm) ? null : hCm;
      goalWeightKg = isNaN(gwKg) ? null : gwKg;
    }

    var goal = document.getElementById('f_goal').value;
    var activityEl = document.getElementById('f_activity');
    var activityMultiplier = activityEl ? parseFloat(activityEl.value) : (settings.activityMultiplier || 1.2);

    settings = {
      units: units,
      sex: sex,
      age: isNaN(age) ? null : age,
      heightCm: heightCm,
      weightKg: weightKg,
      goalWeightKg: goalWeightKg,
      goal: goal,
      baselineMode: settings.baselineMode || 'bmr',
      activityMultiplier: activityMultiplier,
      avatarClass: settings.avatarClass,
      avatarScheme: settings.avatarScheme,
      lastExportAt: settings.lastExportAt
    };
    await saveSettings();
    settingsOpen = false;
    render();
  };

  App.resetAll = async function(){
    if(!confirm('Clear all logged data and settings? This cannot be undone.')) return;
    settings = {};
    logs = {};
    await saveSettings();
    await saveLogs();
    render();
  };

  App.exportData = function(){
    var payload = {
      exportedAt: new Date().toISOString(),
      settings: settings,
      logs: logs,
      favorites: favorites
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

    settings.lastExportAt = Date.now();
    saveSettings();
    reminderDismissed = true;
    render();
  };

  App.dismissBackupReminder = function(){
    reminderDismissed = true;
    render();
  };

  App.importData = async function(inputEl){
    var errEl = document.getElementById('importErr');
    if(errEl) errEl.textContent = '';
    var file = inputEl.files && inputEl.files[0];
    if(!file) return;
    try{
      var text = await file.text();
      var data = JSON.parse(text);
      if(!data || typeof data !== 'object' || !data.logs || !data.settings){
        throw new Error('bad shape');
      }
      if(!confirm('Import this backup? It will replace your current data.')) { inputEl.value = ''; return; }
      settings = data.settings || {};
      logs = data.logs || {};
      favorites = data.favorites || { food: [], exercise: [] };
      await saveSettings();
      await saveLogs();
      await saveFavorites();
      render();
    }catch(e){
      if(errEl) errEl.textContent = "Couldn't read that file — make sure it's a Ledger backup export.";
    }
    inputEl.value = '';
  };

  App.addEntry = async function(type){
    var nameEl = document.getElementById(type === 'food' ? 'foodName' : 'exName');
    var calEl = document.getElementById(type === 'food' ? 'foodCals' : 'exCals');
    var btn = document.getElementById(type === 'food' ? 'foodAddBtn' : 'exAddBtn');
    var errEl = document.getElementById(type === 'food' ? 'foodAddErr' : 'exAddErr');
    var name = nameEl.value.trim();
    var calsRaw = calEl.value.trim();
    if(!name) return;
    if(errEl) errEl.textContent = '';

    var day = ensureDay(currentDate);

    if(calsRaw !== ''){
      var cals = parseFloat(calsRaw);
      if(isNaN(cals)) return;
      day[type].push({ id: uid(), name: name, cals: cals, estimated: false });
      await saveLogs();
      render();
      return;
    }

    // No calories given — estimate from the description via AI.
    var originalLabel = btn.textContent;
    btn.disabled = true; nameEl.disabled = true; calEl.disabled = true;
    btn.textContent = 'Estimating…';
    try{
      var result = type === 'food'
        ? await estimateFoodCalories(name)
        : await estimateExerciseCalories(name, settings);
      var estCals = Math.round(Number(result.calories));
      if(!isFinite(estCals)) throw new Error('bad estimate');
      var label = (result.label && String(result.label).trim()) || name;
      day[type].push({ id: uid(), name: label, cals: estCals, estimated: true });
      await saveLogs();
      render();
    }catch(e){
      btn.disabled = false; nameEl.disabled = false; calEl.disabled = false; btn.textContent = originalLabel;
      if(errEl) errEl.textContent = "Couldn't estimate that — try entering calories directly.";
    }
  };

  App.deleteEntry = async function(type, id){
    var day = ensureDay(currentDate);
    day[type] = day[type].filter(function(it){ return it.id !== id; });
    await saveLogs();
    render();
  };

  App.searchFoodDb = function(v){
    dbSearchQuery = v;
    var el = document.getElementById('foodDbResults');
    if(el) el.innerHTML = renderFoodDbResultsHtml(dbSearchQuery);
  };

  App.logDbItem = async function(id){
    var item = FOOD_DB.find(function(f){ return f.id === id; });
    if(!item) return;
    var day = ensureDay(currentDate);
    day.food.push({ id: uid(), name: item.name + ' (' + item.unit + ')', cals: item.cals, estimated: true });
    await saveLogs();
    render();
  };

  App.saveDbItemToFavorites = async function(id){
    var item = FOOD_DB.find(function(f){ return f.id === id; });
    if(!item) return;
    favorites.food.push({ id: uid(), name: item.name + ' (' + item.unit + ')', cals: item.cals, estimated: true });
    await saveFavorites();
    render();
  };

  App.logFavorite = async function(type, favId){
    var fav = (favorites[type] || []).find(function(f){ return f.id === favId; });
    if(!fav) return;
    var day = ensureDay(currentDate);
    day[type].push({ id: uid(), name: fav.name, cals: fav.cals, estimated: !!fav.estimated });
    await saveLogs();
    render();
  };

  App.deleteFavorite = async function(type, favId){
    favorites[type] = (favorites[type] || []).filter(function(f){ return f.id !== favId; });
    await saveFavorites();
    render();
  };

  App.bumpFavorites = async function(type, delta){
    favorites[type] = (favorites[type] || []).map(function(f){
      return { id: f.id, name: f.name, cals: Math.max(0, f.cals + delta), estimated: f.estimated };
    });
    await saveFavorites();
    render();
  };

  App.addFavorite = async function(type){
    var nameEl = document.getElementById(type + 'FavName');
    var calEl = document.getElementById(type + 'FavCals');
    var btn = document.getElementById(type + 'FavAddBtn');
    var errEl = document.getElementById(type + 'FavErr');
    var name = nameEl.value.trim();
    var calsRaw = calEl.value.trim();
    if(!name) return;
    if(errEl) errEl.textContent = '';

    if(calsRaw !== ''){
      var cals = parseFloat(calsRaw);
      if(isNaN(cals)) return;
      favorites[type].push({ id: uid(), name: name, cals: cals, estimated: false });
      await saveFavorites();
      render();
      return;
    }

    var originalLabel = btn.textContent;
    btn.disabled = true; nameEl.disabled = true; calEl.disabled = true;
    btn.textContent = 'Estimating…';
    try{
      var result = type === 'food'
        ? await estimateFoodCalories(name)
        : await estimateExerciseCalories(name, settings);
      var estCals = Math.round(Number(result.calories));
      if(!isFinite(estCals)) throw new Error('bad estimate');
      var label = (result.label && String(result.label).trim()) || name;
      favorites[type].push({ id: uid(), name: label, cals: estCals, estimated: true });
      await saveFavorites();
      render();
    }catch(e){
      btn.disabled = false; nameEl.disabled = false; calEl.disabled = false; btn.textContent = originalLabel;
      if(errEl) errEl.textContent = "Couldn't estimate that — try entering calories directly.";
    }
  };

  App.logWeight = async function(){
    var el = document.getElementById('weightInput');
    var v = parseFloat(el.value);
    if(isNaN(v)) return;
    var kg = (settings.units || 'imperial') === 'imperial' ? v * 0.453592 : v;
    var day = ensureDay(currentDate);
    day.weight = kg;
    await saveLogs();
    render();
  };

  App.addWater = async function(ml){
    var day = ensureDay(currentDate);
    day.water = Math.max(0, (day.water || 0) + ml);
    await saveLogs();
    render();
  };

  App.addCustomWater = async function(){
    var el = document.getElementById('customWaterInput');
    var v = parseFloat(el.value);
    if(isNaN(v) || v <= 0) return;
    await App.addWater(v);
  };

  App.resetWater = async function(){
    var day = ensureDay(currentDate);
    day.water = 0;
    await saveLogs();
    render();
  };

  function bindDynamicHandlers(){
    ['foodCals','exCals'].forEach(function(id){
      var el = document.getElementById(id);
      if(el){ el.addEventListener('keydown', function(e){
        if(e.key === 'Enter') App.addEntry(id === 'foodCals' ? 'food' : 'exercise');
      }); }
    });
    var wEl = document.getElementById('weightInput');
    if(wEl){ wEl.addEventListener('keydown', function(e){ if(e.key==='Enter') App.logWeight(); }); }
    var cwEl = document.getElementById('customWaterInput');
    if(cwEl){ cwEl.addEventListener('keydown', function(e){ if(e.key==='Enter') App.addCustomWater(); }); }
  }

  window.App = App;

  // ---------------- init ----------------
  (async function init(){
    await loadState();
    lastSeenLevel = levelInfo().level;
    render();
  })();
})();
</script>
